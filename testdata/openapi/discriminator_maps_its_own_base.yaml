# A discriminator's mapping may name the schema declaring it, a base whose own
# instances are a payload as its subtypes' are (docs/ir/models.md#discriminator),
# from a mapping entry and from the default a 3.2 document names. The sweep
# holds the document to an error-free run.
openapi: 3.2.0
info: {title: Discriminator Maps Its Own Base, version: "1"}
paths: {}
components:
  schemas:
    Base:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
      discriminator:
        propertyName: kind
        mapping:
          base: '#/components/schemas/Base'
          sub: '#/components/schemas/Sub'
        defaultMapping: '#/components/schemas/Base'
    Sub:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            extra: {type: string}
