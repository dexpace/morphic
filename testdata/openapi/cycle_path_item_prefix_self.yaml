# A path item whose $ref names a position inside itself, through the reference
# being resolved. The resolver deadlocked on that walk once; the read needs its
# own chain, so the reference is reported unresolved
# (docs/compilers/openapi.md#reference-cycles, GitHub #574).
openapi: 3.1.0
info: {title: Path Item Prefix Self, version: "1"}
paths:
  /a: {$ref: '#/paths/~1a/t'}
