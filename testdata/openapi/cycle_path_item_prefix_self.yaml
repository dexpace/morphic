# A path item whose $ref names a position *inside itself*. The pointer does not
# resolve — there is no `t` key — so the chain looks dangling, but its prefix
# '#/paths/~1a' re-enters the reference being resolved, which deadlocked the
# resolver at an earlier version and is refused here
# (docs/parser-library.md#reference-object-cycle).
openapi: 3.1.0
info: {title: Path Item Prefix Self, version: "1"}
paths:
  /a: {$ref: '#/paths/~1a/t'}
