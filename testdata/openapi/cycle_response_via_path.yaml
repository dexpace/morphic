# A response object that references its own position: a reference object
# rather than a path item, spelled through /paths, and reported as a loop all
# the same
# (docs/compilers/openapi.md#reference-cycles).
openapi: 3.1.0
info: {title: Response Via Path, version: "1"}
paths:
  /a:
    get:
      operationId: a
      responses:
        "200": {$ref: '#/paths/~1a/get/responses/200'}
