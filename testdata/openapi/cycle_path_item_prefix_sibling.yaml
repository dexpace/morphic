# The same prefix, with a sibling at the key the pointer names. The pointer
# reads the get written beside the $ref, where it is written, an operation and
# no path item, so the reference is unresolved
# (docs/compilers/openapi.md#path-item-ref-fields).
openapi: 3.1.0
info: {title: Path Item Prefix Sibling, version: "1"}
paths:
  /a:
    $ref: '#/paths/~1a/get'
    get: {operationId: a, responses: {"200": {description: ok}}}
