# The same prefix, with a sibling at the key the pointer names. The resolver
# reads a path item's pointer through the item its $ref names, not beside it,
# and reports the reference unresolved.
openapi: 3.1.0
info: {title: Path Item Prefix Sibling, version: "1"}
paths:
  /a:
    $ref: '#/paths/~1a/get'
    get: {operationId: a, responses: {"200": {description: ok}}}
