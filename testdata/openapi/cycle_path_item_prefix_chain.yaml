# The prefix through a reference reached on the second hop rather than the
# first: /b's pointer passes through /a, whose chain needs /b's read. /b alone
# is reported unresolved; /a, leading into it, draws nothing of its own
# (docs/compilers/openapi.md#reference-cycles).
openapi: 3.1.0
info: {title: Path Item Prefix Chain, version: "1"}
paths:
  /b: {$ref: '#/paths/~1a/t'}
  /a: {$ref: '#/paths/~1b'}
