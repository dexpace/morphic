# A position beneath `not` is reached only by references: the declaration that
# owns not's body keeps it verbatim in Unmodeled rather than lowering it. Two
# references into one such region, one aimed at it and one beneath it, name the
# shared inner position alike whichever lowers first, because its name is a
# function of the pointer alone (GitHub #529). /a, whose reference is the inner
# one, is declared first here.
openapi: 3.1.0
info:
  title: Two references into one undeclared region agree in either order
  version: 1.0.0
paths:
  /a:
    get:
      operationId: getA
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/paths/~1b/get/responses/200/content/application~1json/schema/not/items'
  /b:
    get:
      operationId: getB
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                not:
                  type: array
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        v:
                          type: string
  /c:
    get:
      operationId: getC
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/paths/~1b/get/responses/200/content/application~1json/schema/not'
