# The prefix spelled with a trailing separator: '/A/' ends in an empty
# reference token, which v1.24.0 read as a key under A, deadlocking on A's lock
# on the way there. The resolver now reports it unresolved, at the use and the
# component.
openapi: 3.1.0
info: {title: Path Item Empty Segment, version: "1"}
paths:
  /a: {$ref: '#/components/pathItems/A'}
components:
  pathItems:
    A: {$ref: '#/components/pathItems/A/'}
