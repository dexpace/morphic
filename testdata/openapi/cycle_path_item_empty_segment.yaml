# The re-entrant prefix spelled with a trailing separator. '/A/' ends in an
# empty reference token, which RFC 6901 and the resolver's own pointer parser
# both read as naming the key "" under A — so the walk re-enters A, the
# reference already being resolved, before the missing key can be reported
# (docs/parser-library.md#reference-object-cycle). A scan dropping the empty
# token read it as stopping at A, a components-only cycle left to the resolver.
openapi: 3.1.0
info: {title: Path Item Empty Segment, version: "1"}
paths:
  /a: {$ref: '#/components/pathItems/A'}
components:
  pathItems:
    A: {$ref: '#/components/pathItems/A/'}
