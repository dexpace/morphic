# The prefix spelled with a trailing separator: '/A/' ends in an empty
# reference token, which the resolver reads as a key under A, through the
# reference it is resolving. It deadlocked there once, and now reports the
# reference unresolved, at the use and the component
# (docs/parser-library.md#reference-object-cycle).
openapi: 3.1.0
info: {title: Path Item Empty Segment, version: "1"}
paths:
  /a: {$ref: '#/components/pathItems/A'}
components:
  pathItems:
    A: {$ref: '#/components/pathItems/A/'}
