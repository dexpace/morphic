# A schema whose pointer passes through its own $ref to a member that refers
# back. The resolver reads a schema's pointer through the schema's own members,
# so the hop lands on p and the chain loops, recursing until the stack runs out
# (GitHub #932).
openapi: 3.1.0
info: {title: Schema Through Own Member, version: "1"}
paths: {}
components:
  schemas:
    A:
      $ref: '#/components/schemas/A/properties/p'
      properties:
        p: {$ref: '#/components/schemas/A'}
