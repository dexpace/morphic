# Two paths whose only key is a $ref to each other, by document position. The
# resolver follows the chain in a loop and reports the cycle as an unresolved
# reference, so the cycle scan leaves it to the resolver (GitHub #574).
openapi: 3.1.0
info: {title: Path Item Mutual, version: "1"}
paths:
  /a: {$ref: '#/paths/~1b'}
  /b: {$ref: '#/paths/~1a'}
