# Two paths whose only key is a $ref to each other, by document position. The
# chain loops and never reaches a path item, a loop reported once as
# openapi/cyclic-ref at its least member
# (docs/compilers/openapi.md#reference-cycles, GitHub #574).
openapi: 3.1.0
info: {title: Path Item Mutual, version: "1"}
paths:
  /a: {$ref: '#/paths/~1b'}
  /b: {$ref: '#/paths/~1a'}
