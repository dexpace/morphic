# A chain that starts and ends in components but leaves it in between, which
# the resolver reports as it does a chain that never leaves
# (docs/parser-library.md#reference-object-cycle).
openapi: 3.1.0
info: {title: Path Item Via Component, version: "1"}
paths:
  /a: {$ref: '#/components/pathItems/X'}
components:
  pathItems:
    X: {$ref: '#/paths/~1a'}
