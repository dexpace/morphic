openapi: 3.1.0
info: {title: SecurityRootEmpty, version: "1.0.0"}
# Written empty, the document states that an operation needs no auth, which a
# document writing no security leaves unsaid.
security: []
paths:
  /open:
    get:
      operationId: inheritsTheRoot
      responses:
        "200":
          description: ok
  /guarded:
    get:
      operationId: overridesTheRoot
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
