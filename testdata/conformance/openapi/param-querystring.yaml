openapi: 3.2.0
info: {title: ParamQuerystring, version: "1.0.0"}
paths:
  # 3.2 binds the whole query string from the parameter's content, so style and
  # explode are not legal keywords here and the binding carries neither.
  /reports:
    get:
      operationId: runReport
      parameters:
        - name: criteria
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  since: {type: string, format: date}
                  status: {type: string}
      responses:
        "200": {description: ok}
  # The contrast, in its own operation because a querystring parameter may not
  # share one with an in: query parameter: a location that does admit the
  # defaults, so the golden shows the difference is the location.
  /reports/summary:
    get:
      operationId: summarize
      parameters:
        - {name: status, in: query, schema: {type: string}}
      responses:
        "200": {description: ok}
  # The other half of the rule: only the *default* is suppressed here. 3.2
  # forbids explode at this location as it forbids style, but the bundled parser
  # refuses neither (GitHub #408), so a declared one reaches the compiler and
  # lowers as declared — dropping what a document states is an emitter's call.
  # param-style-matrix declares neither keyword at this location, so its golden
  # cannot see this half move.
  /reports/raw:
    get:
      operationId: rawReport
      parameters:
        - name: criteria
          in: querystring
          explode: false
          content:
            application/x-www-form-urlencoded:
              schema: {type: object}
      responses:
        "200": {description: ok}
