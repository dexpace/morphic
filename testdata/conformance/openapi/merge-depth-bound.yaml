openapi: 3.1.0
info: {title: MergeDepthBound, version: "1"}
# A schema merges its keywords through `<<`: some from short chains the reader
# expands, and a description through a chain of 65 merges, one past the 64 the
# reader expands. The schema is read from the keys within the bound alone, so the
# description at the far end is neither lowered nor kept, and the warning at the
# schema says why. Every other keyword is read as written, and a schema that
# merges nothing (Plain) is read as it always is.
