openapi: 3.1.0
info:
  title: allOf redeclared models
  version: '1'
paths: {}
components:
  schemas:
    Meeting:
      type: object
      properties:
        id: {type: string}
    Recording:
      type: object
      properties:
        url: {type: string}
    Pet:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
      discriminator:
        propertyName: kind
    # A component, then an inline object: the component is the Base, as the sole
    # $ref of a written allOf is, and the inline object a Mixin.
    RefFirst:
      allOf:
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Meeting'}
        - type: object
          properties:
            data:
              type: object
              properties:
                ai: {type: string}
    # The same declarations in the other order compose the same way.
    InlineFirst:
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                ai: {type: string}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Meeting'}
    # Two inline objects and a bare {}: the {} adds no conjunct, and with no
    # $ref among them both objects are Mixins, in declaration order.
    TwoInline:
      allOf:
        - type: object
          properties:
            data:
              type: object
              properties:
                first: {type: string}
        - type: object
          properties:
            data: {}
        - type: object
          properties:
            data:
              type: object
              properties:
                second: {type: string}
    # Two components, neither discriminated: both are Mixins, and the field
    # admits null only because every declaration does.
    TwoComponents:
      allOf:
        - type: object
          properties:
            data:
              oneOf:
                - {$ref: '#/components/schemas/Meeting'}
                - {type: 'null'}
        - type: object
          properties:
            data:
              oneOf:
                - {$ref: '#/components/schemas/Recording'}
                - {type: 'null'}
    # Among several $refs the discriminated one is the Base, wherever it sits.
    DiscriminatedBase:
      allOf:
        - type: object
          properties:
            pet: {$ref: '#/components/schemas/Recording'}
        - type: object
          properties:
            pet: {$ref: '#/components/schemas/Pet'}
    # The same declarations in the other order keep that Base.
    DiscriminatedFirst:
      allOf:
        - type: object
          properties:
            pet: {$ref: '#/components/schemas/Pet'}
        - type: object
          properties:
            pet: {$ref: '#/components/schemas/Recording'}
    # A value says nothing of the whole composition, so it is kept, not adopted.
    KeptDefault:
      allOf:
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Meeting'
              default: {id: a}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Recording'}
    # A $ref into a branch makes a model carrying that declaration alone, so the
    # field the branches make together is another property, and no declaration's
    # own ID is free for it to take.
    RefIntoBranch:
      allOf:
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Meeting'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Recording'}
    BranchUser:
      type: object
      properties:
        branch: {$ref: '#/components/schemas/RefIntoBranch/allOf/0'}
        other: {$ref: '#/components/schemas/RefIntoBranch/allOf/1'}
    # A model and the wrapper it flattens share a first declaration, and fold
    # different sets, so each field names a composition of its own.
    SharedFirst:
      allOf:
        - allOf:
            - type: object
              properties:
                data: {$ref: '#/components/schemas/Meeting'}
            - type: object
              properties:
                data: {$ref: '#/components/schemas/Recording'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Pet'}
    FirstWrapperUser:
      type: object
      properties:
        wrapper: {$ref: '#/components/schemas/SharedFirst/allOf/0'}
    # The same with the wrapper last: the two share a last declaration.
    SharedLast:
      allOf:
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Pet'}
        - allOf:
            - type: object
              properties:
                data: {$ref: '#/components/schemas/Meeting'}
            - type: object
              properties:
                data: {$ref: '#/components/schemas/Recording'}
    LastWrapperUser:
      type: object
      properties:
        wrapper: {$ref: '#/components/schemas/SharedLast/allOf/1'}
    MeetingAlias:
      $ref: '#/components/schemas/Meeting'
      description: A meeting under another name.
    Dog:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
        - type: object
          properties:
            barks: {type: boolean}
    # An alias is within what it stands for, so it holds the model and nothing
    # composes. What composes a model holds it the same way, and a bare object
    # holds nothing a model does not.
    AliasAndModel:
      allOf:
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Meeting'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/MeetingAlias'}
    SubtypeAndBase:
      allOf:
        - type: object
          properties:
            pet: {$ref: '#/components/schemas/Pet'}
        - type: object
          properties:
            pet: {$ref: '#/components/schemas/Dog'}
    BareAndModel:
      allOf:
        - type: object
          properties:
            data: {type: object}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Meeting'}
    # Only a type the winner composes stays reachable through it. An object saying
    # anything else, and an alias of a bare object, which may say more, are no bare
    # object, so each composes and keeps what it says. Beside what it stands for,
    # an alias is still the narrower.
    TitledAndModel:
      allOf:
        - type: object
          properties:
            data: {type: object, title: Held on the composition}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Meeting'}
    ConstrainedAliasAndModel:
      allOf:
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AtLeastTwoMembers'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/Meeting'}
    ConstrainedAliasAndBare:
      allOf:
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AnyObject'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/AtLeastTwoMembers'}
    AnyObject:
      type: object
    AtLeastTwoMembers:
      $ref: '#/components/schemas/AnyObject'
      minProperties: 2
