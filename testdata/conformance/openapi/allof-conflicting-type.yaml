openapi: 3.1.0
info: {title: AllOfConflictingType, version: "1.0.0"}
paths: {}
components:
  schemas:
    # A format-narrowed string against an integer: unrelated kinds, so the pair
    # is genuinely unsatisfiable. The first declaration wins; the second is kept
    # beside it. (A format over its bare type is a refinement, not a conflict:
    # see allof-narrowing-redeclaration.)
    Repository:
      allOf:
        - type: object
          properties:
            clone_url: {type: string, format: uri}
        - type: object
          properties:
            clone_url: {type: integer}
    # A nullable loser, so the entry is held to keeping the whole declaration
    # rather than only the type it names.
    Identified:
      allOf:
        - type: object
          properties:
            id: {type: integer}
        - type: object
          properties:
            id: {type: [string, "null"]}
    # Agreeing types and a disagreeing default: not a conflict, and the merged
    # field is whole, but the second declaration's default has nowhere to go
    # and is kept the same way, beside a diagnostic naming what differed.
    Described:
      allOf:
        - type: object
          properties:
            id: {type: integer, default: 1, description: first, example: 1}
        - type: object
          properties:
            id: {type: integer, default: 2, description: second, example: 2}
