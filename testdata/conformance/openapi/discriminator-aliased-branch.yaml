openapi: 3.1.0
info: {title: Discriminator aliased branch, version: "1"}
paths: {}
components:
  schemas:
    Cat:
      type: object
      properties:
        kind: {type: string}
    Dog:
      type: object
      properties:
        kind: {type: string}
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
          description: a cat
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
          dog: Dog
    Unknown:
      oneOf:
        - $ref: '#/components/schemas/Cat'
          k-beside: 1
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: kind
        mapping:
          cat: Cat
