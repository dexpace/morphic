openapi: 3.1.0
info: {title: EncodingUnionBranches, version: "1.0.0"}
paths:
  # A part only a union's branch declares is keyed by the first variant
  # declaring it.
  /one-of:
    post:
      operationId: oneOf
      requestBody:
        content:
          multipart/form-data:
            schema:
              oneOf:
                - {type: object, properties: {file: {type: string, format: binary}}}
                - {type: object, properties: {url: {type: string}}}
            encoding:
              file: {contentType: image/png}
      responses: {"204": {description: ok}}
  /any-of:
    post:
      operationId: anyOf
      requestBody:
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/Either'}
            encoding:
              file: {contentType: image/png}
      responses: {"204": {description: ok}}
  # A union written as an allOf branch, which the composition is distributed
  # across.
  /composed:
    post:
      operationId: composed
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - oneOf:
                    - {properties: {targetUrl: {type: string}}}
                    - {properties: {torrentfile: {type: string, format: binary}}}
                - $ref: '#/components/schemas/Common'
            encoding:
              torrentfile: {contentType: application/x-bittorrent}
      responses: {"204": {description: ok}}
  # A multi-typed body lowers to a union of a string and a model holding its
  # properties.
  /multi-typed:
    post:
      operationId: multiTyped
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: [string, object]
              properties:
                file: {type: string}
            encoding:
              file: {contentType: image/png}
      responses: {"204": {description: ok}}
  # A name two branches declare is one part, whose flags read each.
  /shared:
    post:
      operationId: shared
      requestBody:
        content:
          multipart/form-data:
            schema:
              oneOf:
                - {type: object, properties: {doc: {type: string, format: binary}}}
                - {type: object, properties: {doc: {type: array, items: {type: string, format: binary}}}}
      responses: {"204": {description: ok}}
components:
  schemas:
    Either:
      anyOf:
        - {type: object, properties: {file: {type: string, format: binary}}}
        - oneOf:
            - {type: object, properties: {url: {type: string}}}
            - {type: object, properties: {id: {type: integer}}}
    Common: {type: object, properties: {name: {type: string}}}
