# format: password asks for a value to be redacted. It names no shape, so it
# lands where a declaration's annotations do: Sensitive on the node a position
# owns, whatever its kind, or Property.Secret at a property or header that owns
# none. A parameter has no redaction field, so it keeps the format verbatim
# (GitHub #578). This fixture writes it once per position the compiler reaches,
# so a regression at any one of them reddens the golden and the assertion
# beside it (GitHub #579).
openapi: 3.1.0
info: {title: SecretFormat, version: "1.0.0"}
paths:
  /login:
    post:
      operationId: login
      parameters:
        # Inline at a parameter, which has no field to hold it, and through a
        # $ref, which resolves to the component's Sensitive node.
        - {name: X-Token, in: header, schema: {type: string, format: password, minLength: 12, description: the session token}}
        - {name: api_key, in: query, schema: {$ref: '#/components/schemas/Pw'}}
      requestBody:
        content:
          application/json:
            # The media-type schema itself: a position with no carrier.
            schema: {type: string, format: password}
      responses:
        '200':
          description: ok
          headers:
            X-Secret:
              schema: {type: string, format: password}
            # A nullable reference: the header's type is the component itself.
            X-Maybe:
              schema: {oneOf: [{$ref: '#/components/schemas/Pw'}, {type: 'null'}]}
          content:
            application/json:
              schema: {type: string, format: password}
components:
  schemas:
    Pw: {type: string, format: password, minLength: 8}
    Plain: {type: string}
    Login:
      type: object
      properties:
        inline: {type: string, format: password, description: shown on the property}
        viaRef: {$ref: '#/components/schemas/Pw'}
        viaAlias: {$ref: '#/components/schemas/Chain'}
        # A redaction written beside a $ref binds the use, not the referent.
        beside: {$ref: '#/components/schemas/Plain', format: password}
        refined: {allOf: [{$ref: '#/components/schemas/Plain'}], format: password}
        inBranch: {allOf: [{$ref: '#/components/schemas/Plain'}, {format: password}]}
        # A wrapper reaches the Sensitive node through its type.
        nullable: {oneOf: [{$ref: '#/components/schemas/Pw'}, {type: 'null'}]}
        # An allOf over a string is a use of it.
        wrapped: {allOf: [{$ref: '#/components/schemas/Pw'}], description: annotated}
        # A position owning a node of another kind still owns the redaction.
        pick: {type: string, enum: [a, b], format: password}
        pin: {type: integer, format: password}
        arr:
          type: array
          items: {type: string, format: password, maxLength: 64}
        # The guard: a bare string keeps the shared primitive, never sensitive.
        plain: {type: string}
    Bag:
      type: object
      patternProperties:
        '^x-': {type: string, format: password}
      additionalProperties: {type: string, format: password}
    Pair:
      type: array
      prefixItems:
        - {type: string, format: password}
    Tokens:
      type: array
      items: {$ref: '#/components/schemas/Plain', format: password}
    Either: {oneOf: [{type: string, format: password}, {type: integer}]}
    Code: {const: s3cret, format: password}
    Opaque: {format: password}
    Encoded: {type: string, format: password, contentEncoding: base64}
    # An alias declared after its first use, so no node exists when Login is
    # lowered.
    Chain: {$ref: '#/components/schemas/Pw'}
