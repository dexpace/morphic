# format: password states a value must be redacted — a fact about how the value
# is handled rather than what shape it has — so it hoists a Scalar carrying
# Sensitive and the verbatim spelling at every schema position, with
# Property.Secret beside it where a property or a header carries one. This
# fixture writes it once per position the compiler reaches, so a regression at
# any one of them reddens the golden and the assertion beside it (GitHub #579).
openapi: 3.1.0
info: {title: SecretFormat, version: "1.0.0"}
paths:
  /login:
    post:
      operationId: login
      parameters:
        # A parameter schema, inline, and one reached through a $ref.
        - {name: X-Token, in: header, schema: {type: string, format: password}}
        - {name: api_key, in: query, schema: {$ref: '#/components/schemas/Pw'}}
      requestBody:
        content:
          application/json:
            # The media-type schema itself: a hoisted position with no carrier.
            schema: {type: string, format: password}
      responses:
        '200':
          description: ok
          headers:
            X-Secret:
              schema: {type: string, format: password}
          content:
            application/json:
              schema: {type: string, format: password}
components:
  schemas:
    Pw: {type: string, format: password}
    Login:
      type: object
      properties:
        viaRef: {$ref: '#/components/schemas/Pw'}
        inline: {type: string, format: password}
        arr:
          type: array
          items: {type: string, format: password}
        # The guard: a bare string must keep resolving to the shared primitive,
        # which stays not sensitive.
        plain: {type: string}
    Bag:
      type: object
      patternProperties:
        '^x-': {type: string, format: password}
      additionalProperties: {type: string, format: password}
    Pair:
      type: array
      prefixItems:
        - {type: string, format: password}
