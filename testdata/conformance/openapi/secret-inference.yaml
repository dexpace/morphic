# A parameter, a header or a property whose name ends in a credential's, and
# whose value is text or bytes, is redacted under the secret policy, marked as
# inferred, where the document asks nothing about its redaction. A name ending
# in another word, a value of another type, and a use the document marks
# either way are left as written.
openapi: 3.1.0
info: {title: SecretInference, version: "1.0.0"}
paths:
  /logs:
    get:
      operationId: listLogs
      parameters:
        - {name: R2-Secret-Access-Key, in: header, required: true, schema: {type: string}}
        - {name: R2-Access-Key-Id, in: header, required: true, schema: {type: string}}
        - {name: page_token, in: query, schema: {type: string}}
        - {name: api_key, in: query, schema: {$ref: '#/components/schemas/Key'}}
        - {name: password, in: query, x-sensitive: false, schema: {type: string}}
      responses:
        '200':
          description: ok
          headers:
            X-Auth-Token: {schema: {type: string}}
            X-Token-Type: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Credentials'}
components:
  schemas:
    Key: {type: string, minLength: 8}
    Credentials:
      type: object
      properties:
        client_secret: {type: string}
        privateKey: {type: string, format: byte}
        secret_id: {type: string}
        has_password: {type: boolean}
        secret:
          type: object
          properties:
            name: {type: string}
        refresh_token: {$ref: '#/components/schemas/Unredacted'}
        session_token: {type: string, format: password}
    Unredacted: {type: string, x-sensitive: false}
