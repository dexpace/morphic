openapi: 3.2.0
info: {title: Header Name Syntax, version: "1.0.0"}
paths:
  /traces:
    get:
      operationId: getTrace
      parameters:
        # One header spelled in two cases, a repeat OpenAPI forbids as it does any:
        # both are kept, each under the ID its spelling gives it.
        - {name: X-Trace, in: header, schema: {type: string}}
        - {name: x-trace, in: header, schema: {type: string}}
      responses:
        "200":
          description: ok
          headers:
            # A header's key is its name, so a token: this one lowers as declared.
            not a token: {schema: {type: string}}
components:
  schemas:
    # Only a reference reaches the itemSchema of a header's content, so a
    # reference is also what lowers each one's items; the key, "" here, is what
    # its hint composes from, beneath an Encoding Object another nests too.
    Frame: {$ref: '#/components/responses/Framed/headers//content/application~1jsonl/itemSchema'}
    HeaderItem: {$ref: '#/components/responses/Listed/headers//schema/items'}
    HeaderContentItem: {$ref: '#/components/responses/Carried/headers//content/application~1json/schema/items'}
    NestedItem: {$ref: '#/components/requestBodies/Parts/content/multipart~1form-data/encoding/part/encoding/inner/headers//schema/items'}
  requestBodies:
    Parts:
      content:
        multipart/form-data:
          schema: {type: object, properties: {part: {type: object, properties: {inner: {type: string}}}}}
          encoding:
            part:
              contentType: multipart/mixed
              encoding:
                inner:
                  headers:
                    "":
                      schema: {type: array, items: {type: object, properties: {n: {type: string}}}}
  responses:
    Framed:
      description: ok
      headers:
        "":
          content:
            application/jsonl:
              itemSchema: {type: object, properties: {f: {type: string}}}
    Listed:
      description: ok
      headers:
        "":
          schema: {type: array, items: {type: object, properties: {h: {type: string}}}}
    Carried:
      description: ok
      headers:
        "":
          content:
            application/json:
              schema: {type: array, items: {type: object, properties: {i: {type: string}}}}
