openapi: 3.1.0
info: {title: SecurityRootOptional, version: "1.0.0"}
# The document's one requirement is the empty one: authentication is optional,
# which is neither public nor left out.
security:
  - {}
paths:
  /absent:
    get:
      operationId: absent
      responses:
        "200":
          description: ok
  /required:
    get:
      operationId: required
      security:
        - apiKey: []
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
