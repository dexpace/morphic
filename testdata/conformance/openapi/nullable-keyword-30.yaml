openapi: 3.0.3
# OpenAPI 3.0's `nullable: true` adds null to the type written in the same
# Schema Object, which every other keyword of that schema conjoins with. Each
# property but `typed` and `listed` admits null only as the nullable-widening
# policy reads the keyword, admitting null for the whole schema it is on: no
# type beside it, an enum listing no null, an allOf whose branch excludes null.
info: {title: NullableKeyword30, version: "1.0.0"}
paths: {}
components:
  schemas:
    Pet: {type: object, properties: {name: {type: string}}}
    Holder:
      type: object
      properties:
        typed: {type: string, nullable: true}
        untyped: {nullable: true}
        composed:
          nullable: true
          allOf: [{$ref: '#/components/schemas/Pet'}]
        unlisted: {type: string, nullable: true, enum: [red, green]}
        listed: {type: string, nullable: true, enum: [red, green, null]}
        typedComposed:
          type: object
          nullable: true
          allOf: [{$ref: '#/components/schemas/Pet'}]
