openapi: 3.1.0
info:
  title: Discriminated union beside a model
  version: "1"
paths: {}
components:
  schemas:
    # The branches are not subtypes of Pet, so a model discriminator mapping to
    # them is one no emitter could route: it stays beside the kept union.
    Pet:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
    Cat:
      type: object
      properties:
        kind: {type: string}
        meow: {type: boolean}
    Dog:
      type: object
      properties:
        kind: {type: string}
        bark: {type: boolean}
    # Here every target is a true subtype of Shape, so the model keeps it. Shape
    # is declared first, so a decision taken while Shape lowers would find
    # neither subtype interned yet.
    Shape:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
    Circle:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          properties:
            radius: {type: number}
    Square:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          properties:
            side: {type: number}
    # Bird writes allOf to Animal, but also a oneOf the allOf is distributed
    # across, so Bird lowers to a union and is no subtype of Animal. Only the
    # lowered document can tell, so the discriminator is kept beside the union.
    Animal:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          bird: '#/components/schemas/Bird'
      oneOf:
        - $ref: '#/components/schemas/Bird'
    Bird:
      allOf:
        - $ref: '#/components/schemas/Animal'
      oneOf:
        - $ref: '#/components/schemas/Finch'
        - $ref: '#/components/schemas/Crow'
    Finch:
      type: object
      properties:
        song: {type: string}
    Crow:
      type: object
      properties:
        caw: {type: string}
