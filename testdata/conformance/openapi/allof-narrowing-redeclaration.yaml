openapi: 3.1.0
info: {title: AllOfNarrowingRedeclaration, version: "1.0.0"}
paths: {}
components:
  schemas:
    # One branch narrows a bare primitive the other leaves broader: a format over
    # its bare type, an integer width over a wider one, or any type over the top
    # type. The intersection is the narrower kind, so the merge loses nothing: no
    # warning, and the same type whichever branch comes first. Only a value the
    # broader branch wrote and the narrower kind refuses is kept under
    # Unmodeled, at the declaration that wrote it (see the InadmissibleDefault
    # and RefusedLateDefault models). Each pair is declared in both orders, and
    # each three-branch chain in all three positions of its narrowest member.
    # The orders are separate inputs to one rule: the harness's order oracle
    # keeps sequence order (reverseMappings reverses mappings only), so this
    # fixture is the corpus's only guard on branch order.
    NumberIntegerBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: number}
        - type: object
          properties:
            p: {type: integer}
    NumberIntegerNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: number}
    IntegerInt32BroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: integer, format: int32}
    IntegerInt32NarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer, format: int32}
        - type: object
          properties:
            p: {type: integer}
    StringDatetimeBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: string}
        - type: object
          properties:
            p: {type: string, format: date-time}
    StringDatetimeNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: string, format: date-time}
        - type: object
          properties:
            p: {type: string}
    Int32Int64BroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer, format: int64}
        - type: object
          properties:
            p: {type: integer, format: int32}
    Int32Int64NarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer, format: int32}
        - type: object
          properties:
            p: {type: integer, format: int64}
    UriStringBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: string}
        - type: object
          properties:
            p: {type: string, format: uri}
    UriStringNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: string, format: uri}
        - type: object
          properties:
            p: {type: string}
    DoubleNumberBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: number}
        - type: object
          properties:
            p: {type: number, format: double}
    DoubleNumberNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: number, format: double}
        - type: object
          properties:
            p: {type: number}
    UuidStringBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: string}
        - type: object
          properties:
            p: {type: string, format: uuid}
    UuidStringNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: string, format: uuid}
        - type: object
          properties:
            p: {type: string}
    # A nullable broad declaration beside a non-null narrow one: null is admitted
    # only where both branches admit it, and the broad branch's minimum is
    # adopted onto the merged field.
    NullableBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: [number, "null"], minimum: 0}
        - type: object
          properties:
            p: {type: integer}
    NullableNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: [number, "null"], minimum: 0}
    # The broad branch's default is a value the narrow kind refuses: a fractional
    # number is no integer. It is not adopted onto the merged field; the broad
    # branch is kept whole at its own pointer, with one info, in either order.
    InadmissibleDefaultBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: number, default: 1.5}
        - type: object
          properties:
            p: {type: integer}
    InadmissibleDefaultNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: number, default: 1.5}
    # A three-branch chain, number > integer > int32, with the narrowest first,
    # in the middle and last: the narrowest is the field's type at every position.
    ChainNarrowestFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer, format: int32}
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: number}
    ChainNarrowestMiddle:
      allOf:
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: integer, format: int32}
        - type: object
          properties:
            p: {type: number}
    ChainNarrowestLast:
      allOf:
        - type: object
          properties:
            p: {type: number}
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: integer, format: int32}
    # uint8 sits inside int16 by value, so it narrows it in either order.
    Uint8Int16BroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer, format: int16}
        - type: object
          properties:
            p: {type: integer, format: uint8}
    Uint8Int16NarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer, format: uint8}
        - type: object
          properties:
            p: {type: integer, format: int16}
    # The top type loses to any declaration, in either order.
    TopBroadFirst:
      allOf:
        - type: object
          properties:
            p: {}
        - type: object
          properties:
            p: {type: integer}
    TopNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {}
    # An unknown format is a Scalar over its bare kind, so it wins over the bare
    # string in either order.
    HexBroadFirst:
      allOf:
        - type: object
          properties:
            p: {type: string}
        - type: object
          properties:
            p: {type: string, format: hex}
    HexNarrowFirst:
      allOf:
        - type: object
          properties:
            p: {type: string, format: hex}
        - type: object
          properties:
            p: {type: string}
    # A broad declaration's default meets the integer that wins, with the
    # integer declaration first, in the middle and last. The integer is the
    # field's type in every position, so the default is refused and the entry
    # kept at the branch that wrote it, wherever that branch sits.
    RefusedLateDefaultFirst:
      allOf:
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: number}
        - type: object
          properties:
            p: {type: number, default: 1.5}
    RefusedLateDefaultMiddle:
      allOf:
        - type: object
          properties:
            p: {type: number}
        - type: object
          properties:
            p: {type: integer}
        - type: object
          properties:
            p: {type: number, default: 1.5}
    RefusedLateDefaultLast:
      allOf:
        - type: object
          properties:
            p: {type: number}
        - type: object
          properties:
            p: {type: number, default: 1.5}
        - type: object
          properties:
            p: {type: integer}
    # A $ref into the broad branch makes a model carrying that declaration alone,
    # so the narrowed field is another property.
    NarrowedPastARef:
      allOf:
        - type: object
          properties:
            p: {type: number}
        - type: object
          properties:
            p: {type: integer}
    NarrowedBranchUser:
      type: object
      properties:
        branch: {$ref: '#/components/schemas/NarrowedPastARef/allOf/0'}
