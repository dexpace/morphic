openapi: 3.2.0
info: {title: Empty Names, version: "1.0.0"}
paths:
  /widgets:
    get:
      # A tag declared as "" names the group the operation lands in.
      tags: [""]
      responses:
        "200": {description: ok}
components:
  securitySchemes:
    "": {type: http, scheme: bearer}
  schemas:
    # A component keyed "" earns no named TypeID, so it hoists as an anonymous
    # type whose only name channel is the hint.
    "": {type: string}
    # "" and "empty" are two distinct values whose members land on the same word.
    # Both must survive: uniquifying identifiers is an emitter's job.
    Rollout:
      type: string
      enum: ["", empty, done]
    Widget:
      type: object
      properties:
        "":
          type: object
          properties:
            leaf: {type: string}
    # Every schema below hangs a child off an unnamed position, and each child's
    # hint is composed from the parent's. Composing onto "" would leave a leading
    # separator no grammar produces, so the parent is minted first.
    Mixed:
      type: object
      properties:
        "":
          enum: [1, "a"]
    List:
      type: object
      properties:
        "":
          type: array
          items: {type: object, properties: {a: {type: string}}}
    Maps:
      type: object
      properties:
        "":
          type: object
          additionalProperties: {type: object, properties: {b: {type: string}}}
    Patterns:
      type: object
      properties:
        "":
          type: object
          patternProperties:
            "^x": {type: object, properties: {c: {type: string}}}
    Tuple:
      type: object
      properties:
        "":
          type: array
          prefixItems: [{type: object, properties: {d: {type: string}}}]
          items: {type: object, properties: {e: {type: string}}}
    Base: {type: object, properties: {id: {type: string}}}
    Alt: {type: object, properties: {alt: {type: string}}}
    Host:
      type: object
      properties:
        "":
          allOf: [{$ref: '#/components/schemas/Base'}]
          oneOf: [{$ref: '#/components/schemas/Alt'}]
    Blob:
      type: object
      properties:
        "":
          type: string
          contentMediaType: application/json
          contentSchema:
            type: object
            properties:
              a: {type: string}
    # A draft schema spells a tuple slot as list-form items and its rest as
    # additionalItems, and both compose from the empty name as prefixItems and
    # items do.
    Old:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        "":
          type: array
          items: [{type: object, properties: {d: {type: string}}}]
          additionalItems: {type: object, properties: {e: {type: string}}}
    # Only a reference reaches the itemSchema of a header's or a parameter's
    # content, and no operation mounts these components, so a reference is also
    # what lowers each one's items; the key or the name is what its hint
    # composes from.
    Frame: {$ref: '#/components/responses/Framed/headers//content/application~1jsonl/itemSchema'}
    Line: {$ref: '#/components/parameters/Unnamed/content/application~1jsonl/itemSchema'}
    HeaderItem: {$ref: '#/components/responses/Listed/headers//schema/items'}
    ParamItem: {$ref: '#/components/parameters/UnnamedList/schema/items'}
    HeaderContentItem: {$ref: '#/components/responses/Carried/headers//content/application~1json/schema/items'}
    ParamContentItem: {$ref: '#/components/parameters/UnnamedContent/content/application~1json/schema/items'}
  responses:
    Framed:
      description: ok
      headers:
        "":
          content:
            application/jsonl:
              itemSchema: {type: object, properties: {f: {type: string}}}
    Listed:
      description: ok
      headers:
        "":
          schema: {type: array, items: {type: object, properties: {h: {type: string}}}}
    Carried:
      description: ok
      headers:
        "":
          content:
            application/json:
              schema: {type: array, items: {type: object, properties: {i: {type: string}}}}
  parameters:
    UnnamedContent:
      name: ""
      in: query
      content:
        application/json:
          schema: {type: array, items: {type: object, properties: {j: {type: string}}}}
    UnnamedList:
      name: ""
      in: query
      schema: {type: array, items: {type: object, properties: {p: {type: string}}}}
    Unnamed:
      name: ""
      in: query
      content:
        application/jsonl:
          itemSchema: {type: object, properties: {g: {type: string}}}
