openapi: 3.1.0
info: {title: DiscriminatorAliasMapping, version: "1.0.0"}
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [petType]
      properties:
        petType: {type: string}
      # Two keys name one subtype: an alias tag. The base's mapping keeps both,
      # and the subtype's single discriminatorValue takes the smallest in byte
      # order — declared here larger-first, the order a first-key-wins reading
      # gets wrong, so the order-invariance sweep meets both orders.
      discriminator:
        propertyName: petType
        mapping:
          zulu: '#/components/schemas/Dog'
          alpha: '#/components/schemas/Dog'
    Dog:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
      properties:
        bark: {type: boolean}
