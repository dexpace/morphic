openapi: 3.1.0
info: {title: TuplesPrefixItems, version: "1.0.0"}
paths: {}
components:
  schemas:
    # Closed `items: false` first, so the closed states are read before the open
    # ones. Closed says nothing may follow the positional head, which is exactly
    # what the Tuple's head states, so the schema keeps no tail entry and is
    # reported for nothing. The positions past a declared MinItems stay
    # unrequired all the same (ir-design §4.8).
    ClosedPair:
      type: array
      prefixItems:
        - {type: string}
        - {type: integer}
      items: false
    # Open, with no `items` written at all: 2020-12 reads an absent `items` as the
    # empty schema `true`, so the effective tail is open and the entry says so as
    # the literal `true`, at the tuple schema's own pointer — no /items node
    # exists for it to be located at, and that pointer is also what tells this
    # apart from a written `items: true`.
    Pair:
      type: array
      prefixItems:
        - {type: string}
        - {type: integer}
    # Closed above and pinned from below: `items: false` bounds the tail to
    # nothing, and minItems: 2 is the lower bound the head itself does not state.
    ExactPair:
      type: array
      prefixItems:
        - {type: string}
        - {type: integer}
      items: false
      minItems: 2
    # Open with a typed tail, kept verbatim at its own /items pointer.
    PairWithTail:
      type: array
      prefixItems:
        - {type: string}
      items: {type: boolean}
    # Closed, with every collection bound the whole instance declares reaching
    # Tuple.Constraints rather than Unmodeled.
    BoundedClosedPair:
      type: array
      prefixItems:
        - {type: string}
        - {type: integer}
      items: false
      minItems: 1
      maxItems: 2
      uniqueItems: true