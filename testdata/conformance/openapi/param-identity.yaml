openapi: 3.1.0
info: {title: ParamIdentity, version: "1.0.0"}
paths:
  /b:
    $ref: "#/components/pathItems/Shared"
  /a:
    $ref: "#/components/pathItems/Shared"
  /archive/b:
    $ref: "#/components/pathItems/Reserved"
  /archive/a:
    $ref: "#/components/pathItems/Reserved"
  /items/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getItem
      parameters:
        - {name: id, in: query, schema: {type: string}}
        - {name: a/b, in: query, schema: {type: string}}
      responses: {"200": {description: ok}}
    post:
      operationId: updateItem
      responses: {"200": {description: ok}}
components:
  pathItems:
    Shared:
      parameters:
        - {name: limit, in: query, schema: {type: integer}}
      get:
        responses: {"200": {description: ok}}
    Reserved:
      # A path item that mounts no operation has none to merge its parameters
      # into, so each mount keeps them as written, under its own pointer and the
      # path the parameter's ID would be derived from.
      parameters:
        - {name: since, in: query, schema: {type: string}}
