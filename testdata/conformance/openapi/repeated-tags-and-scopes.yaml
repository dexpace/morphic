openapi: 3.1.0
info: {title: RepeatedTagsAndScopes, version: "1.0.0"}
tags:
  - name: pets
  - name: store
paths:
  /pets:
    get:
      operationId: listPets
      # A tag names a group the operation joins once, and a scope names a
      # permission the scheme must grant once, so each repeat is kept at its
      # first occurrence and reported where it is written.
      tags: [pets, store, pets]
      security:
        - oauth: [read, write, read]
      responses:
        "200":
          description: ok
components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.com/token
          scopes:
            read: Read pets
            write: Write pets
