openapi: 3.1.0
info: {title: FileBody, version: "1.0.0"}
paths:
  /blob:
    put:
      operationId: putBlob
      requestBody:
        content:
          # No schema: the media type alone makes this a file body.
          application/octet-stream: {}
      responses:
        "200":
          description: ok
          content:
            image/png:
              schema: {type: string, format: binary}
  /documented:
    put:
      operationId: putDocumented
      requestBody:
        content:
          # A binary body keeps what its schema says beyond the format.
          application/octet-stream:
            schema: {$ref: '#/components/schemas/Blob'}
      responses:
        "200":
          description: ok
          content:
            application/octet-stream:
              schema: {type: string, format: binary, description: The stored object.}
  /dialect:
    put:
      operationId: putDialect
      requestBody:
        content:
          # Naming the schema's dialect says nothing of the value, so the media type does.
          application/octet-stream:
            schema: {$schema: 'https://spec.openapis.org/oas/3.1/dialect/base', type: string}
      responses:
        "204": {description: ok}
components:
  schemas:
    Blob: {type: string, format: binary, maxLength: 99, description: Raw bytes}
