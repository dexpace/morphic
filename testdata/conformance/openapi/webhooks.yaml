openapi: 3.1.0
info: {title: Webhooks, version: "1.0.0"}
paths: {}
webhooks:
  newPet:
    # A webhook path item may override the server the delivery is addressed to,
    # exactly as a path may. It is registered, and named by each operation that
    # names none of its own — the point being that every route reads it.
    servers:
      - url: https://hooks.example.com
    post:
      operationId: onNewPet
      # And the operation may override the path item's in turn — OpenAPI says
      # this one wins, so the operation names it, and the path item's list is
      # registered all the same, named by no operation of this item.
      servers:
        - url: https://hooks-override.example.com
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: ok
  # The key names an event, not a path: the braces are part of that name, so
  # the binding carries the key as its webhook name and has no URI template.
  "{tenant}.created":
    post:
      responses:
        "200":
          description: ok
  # The empty key is legal. It names nothing, and the operation is still mounted.
  "":
    post:
      responses:
        "200":
          description: ok
