openapi: 3.1.0
info: {title: Webhooks, version: "1.0.0"}
paths: {}
webhooks:
  newPet:
    # A webhook path item may override the server the delivery is addressed to,
    # exactly as a path may. An operation has no server-scope list, so this is
    # kept verbatim — the point being that it is kept at all.
    servers:
      - url: https://hooks.example.com
    post:
      operationId: onNewPet
      requestBody:
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: ok
