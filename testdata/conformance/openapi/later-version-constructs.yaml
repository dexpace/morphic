openapi: 3.0.3
# Every construct OpenAPI 3.1 or 3.2 added to an object other than a schema's
# own keywords, written once in a document declaring 3.0. Each is read as the
# version that added it defines it, and reported at its own key as a later
# version's. The parameter style cookie is the one addition missing: the bundled
# parser refuses it at every version (GitHub #389).
$self: https://example.com/api/openapi.yaml
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: LaterVersionConstructs
  version: "1.0.0"
  summary: Constructs newer than the declared version.
  license: {name: MIT, identifier: MIT}
servers:
  - {url: "https://api.example.com", name: production}
tags:
  - {name: books, summary: Books, parent: catalog, kind: nav}
  - {name: catalog}
paths:
  /books:
    query:
      operationId: searchBooks
      tags: [books]
      responses: {"200": {description: ok}}
    additionalOperations:
      PURGE:
        operationId: purgeBooks
        responses: {"204": {description: purged}}
    get:
      operationId: listBooks
      tags: [books]
      parameters:
        - name: filter
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema: {type: object, properties: {author: {type: string}}}
      responses:
        "200":
          description: ok
          summary: The books.
          content:
            application/jsonl:
              description: One book per line.
              itemSchema: {$ref: '#/components/schemas/Book'}
              examples:
                one: {dataValue: {title: Dune}, serializedValue: '{"title":"Dune"}'}
        "404": {$ref: '#/components/responses/NotFound', summary: No such book.}
    post:
      operationId: addBooks
      requestBody:
        content:
          multipart/mixed:
            itemEncoding: {contentType: text/plain}
          multipart/related:
            prefixEncoding: [{contentType: application/json}]
          multipart/form-data:
            schema: {type: object, properties: {cover: {type: string}}}
            encoding:
              cover:
                contentType: multipart/mixed
                encoding: {page: {contentType: image/png}}
                prefixEncoding: [{contentType: image/png}]
                itemEncoding: {contentType: image/png}
          application/json:
            $ref: '#/components/mediaTypes/Book'
            description: The book to add.
      responses: {"201": {description: added}}
webhooks:
  bookAdded:
    post:
      operationId: bookAdded
      responses: {"200": {description: ok}}
components:
  pathItems:
    Health:
      get:
        operationId: health
        responses: {"200": {description: ok}}
  responses:
    NotFound: {description: not found}
  mediaTypes:
    Book:
      schema: {$ref: '#/components/schemas/Book'}
  schemas:
    Book:
      type: object
      properties:
        title: {type: string}
    Item:
      type: object
      required: [kind]
      properties:
        kind: {type: string}
      xml: {nodeType: element}
      discriminator:
        propertyName: kind
        defaultMapping: '#/components/schemas/Novel'
    Novel:
      allOf: [{$ref: '#/components/schemas/Item'}]
  securitySchemes:
    clientCert: {type: mutualTLS}
    device:
      type: oauth2
      oauth2MetadataUrl: https://auth.example.com/.well-known/oauth-authorization-server
      deprecated: true
      flows:
        deviceAuthorization:
          deviceAuthorizationUrl: https://auth.example.com/device
          tokenUrl: https://auth.example.com/token
          scopes: {}
