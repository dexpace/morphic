openapi: 3.1.0
info: {title: DiscriminatorInheritance, version: "1.0.0"}
paths: {}
components:
  schemas:
    # The base declares the tag property itself, so the discriminator binds a
    # PropID rather than a bare wire name.
    Pet:
      type: object
      required: [petType]
      properties:
        petType: {type: string}
      # No defaultMapping here: it is a 3.2 keyword and this is a 3.1 document.
      # discriminator-default-mapping.yaml is its witness.
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
    # Named by the mapping: its tag value is the mapping key.
    Cat:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
      properties:
        meow: {type: boolean}
    # Absent from the mapping: its tag value is OpenAPI's implicit schema name.
    Dog:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
      properties:
        bark: {type: boolean}
