openapi: 3.1.0
info: {title: Constraints, version: "1.0.0"}
paths: {}
components:
  schemas:
    S:
      type: object
      minProperties: 1
      maxProperties: 4
      properties:
        ratio:
          type: number
          minimum: 0.30000000000000004
          maximum: 9007199254740993
          multipleOf: 0.1
        # In 2020-12 the two keywords on a side are independent and both apply,
        # so ir.Constraints holds a field for each and each keeps the literal
        # written. Reading whichever came last published ">= 0" here and "< 100"
        # below (GitHub #33); keeping only the tighter left a change to the other
        # keyword invisible to a consumer diffing two revisions (GitHub #425).
        # The two sides are settled opposite ways — the inclusive bound is the
        # tighter here, the exclusive one below — so neither field can be read
        # off the other.
        atLeastTen:
          type: integer
          minimum: 10
          exclusiveMinimum: 0
        underTen:
          type: integer
          maximum: 100
          exclusiveMaximum: 10
        label: {type: string, minLength: 2, maxLength: 8}
        # A value bound applies to values of one kind and lets any other through,
        # so beside a type it does not apply to it bounds nothing: it reaches no
        # Constraints, the property's included, and is kept verbatim, on an alias
        # where the position lowered to a shared primitive.
        id: {minimum: 1, maximum: 9, type: string, pattern: '^a'}
        meta: {minLength: 2, type: object, properties: {a: {type: string}}}
        list: {maxLength: 5, type: array, items: {type: string}}
        # An array hoists a List, which is where a collection bound belongs.
        tags:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: {type: string}
    # A component whose body reduces to a shared primitive owns an alias node,
    # the other carrier a co-declared pair can land on: both bounds go on the
    # node's own constraints, exactly as they do on a property.
    Bounded:
      type: integer
      minimum: 10
      exclusiveMinimum: 0
    # A count past what a 64-bit integer holds reaches no field: it is kept
    # verbatim under its keyword, beside the count the field states.
    HugeCount:
      type: string
      minLength: 1
      maxLength: 99999999999999999999
    # A number takes no length: a component owns its alias, which keeps it.
    Port: {maxLength: 65535, type: number}
