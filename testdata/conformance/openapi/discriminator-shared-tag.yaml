openapi: 3.1.0
info: {title: A tag two subtypes carry, version: "1"}
paths: {}
components:
  schemas:
    # The mapping routes cat to Cat alone.
    Pet:
      type: object
      required: [petType]
      properties:
        petType: {type: string}
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
    # Cat pins the tag to the value the mapping routes it by.
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            petType: {const: cat}
    # Kitten composes Cat, so it admits only cat at petType, which rules out
    # its name, the tag OpenAPI's implicit mapping would give it: it carries
    # cat too, and the one tag routes to both.
    Kitten:
      allOf:
        - $ref: '#/components/schemas/Cat'
