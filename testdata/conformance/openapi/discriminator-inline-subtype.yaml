openapi: 3.1.0
info: {title: DiscriminatorInlineSubtype, version: "1.0.0"}
paths: {}
components:
  schemas:
    # No mapping, so every tag below is OpenAPI's implicit one: the name of the
    # component schema that declares the subtype.
    Pet:
      type: object
      required: [petType]
      properties:
        petType: {type: string}
      discriminator:
        propertyName: petType
    # A component subtype: its tag value is its schema name.
    Dog:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
      properties:
        bark: {type: boolean}
    # Inline subtypes have no schema name, so neither property takes a tag: not
    # the key that matches the component above, and not one that matches nothing.
    Kennel:
      type: object
      properties:
        Dog:
          allOf:
            - {$ref: '#/components/schemas/Pet'}
          properties:
            woof: {type: boolean}
        pet:
          allOf:
            - {$ref: '#/components/schemas/Pet'}
          properties:
            meow: {type: boolean}
    # Nor does a union branch take its ordinal.
    Either:
      oneOf:
        - allOf:
            - {$ref: '#/components/schemas/Pet'}
          properties:
            chirp: {type: boolean}
        - {type: string}
