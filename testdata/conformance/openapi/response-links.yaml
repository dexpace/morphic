openapi: 3.1.0
info: {title: ResponseLinks, version: "1.0.0"}
paths:
  /orders:
    post:
      operationId: createOrder
      responses:
        "201":
          description: created
          links:
            GetOrder:
              operationId: getOrder
              parameters: {orderId: '$response.body#/id'}
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: ok
