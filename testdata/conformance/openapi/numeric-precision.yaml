openapi: 3.1.0
info: {title: NumericPrecision, version: "1.0.0"}
paths: {}
components:
  schemas:
    S:
      type: object
      properties:
        # Bounds beyond float64 range and a huge integer beyond int64; a float64
        # path would drop or round every one of these.
        bounded:
          type: number
          minimum: 1.8e308
          maximum: 123456789012345678901234567890
          multipleOf: 1e-30
        # 2020-12 numeric exclusive bounds: a leading-dot spelling (canonicalized
        # to 0.5) and a high-precision decimal.
        exclusive:
          type: number
          exclusiveMinimum: .5
          exclusiveMaximum: 0.12345678901234567890123456789
        # A default literal beyond float64 range, captured as a number.
        withDefault:
          type: number
          default: 1.8e308
        # A const literal beyond float64 range.
        pinned:
          const: 1.8e308
        # Numeric enum members, one beyond int64 range.
        choice:
          type: integer
          enum: [1, 123456789012345678901234567890]
        # An example in a leading-dot spelling.
        sampled:
          type: number
          example: .5
        # YAML 1.2's core schema takes an integer's base from its prefix (0o,
        # 0x), so these are 420 and 493. Reading the spelling as decimal
        # would store a different number.
        mode:
          type: integer
          default: 0o644
          enum: [0o644, 0o755]
        # The same rule on every numeric bound, and on an example: 15, 31, 10
        # and 30.
        bounds:
          type: integer
          minimum: 0o17
          maximum: 0x1f
          multipleOf: 10
          example: 30
        # A plain digit string is the integer it spells.
        counted:
          type: integer
          default: 1000000
        # A leading zero is a base ten integer in the core schema: the value is
        # 9, and the stored literal must be JSON-valid.
        loose:
          type: number
          default: 09
        # Magnitudes no rational is built for: bounds past what a binary float
        # scales to, and a step past what big.Rat builds. Each is read, never
        # materialized.
        vast:
          type: number
          minimum: -1e2000000000
          maximum: 1e2000000000
          multipleOf: 1e-1000001
        # Everything above rides the Value/BigVal channel. The constructs kept
        # verbatim as raw JSON are a second channel with the same requirement,
        # and it is the one that had no corpus case: a vendor extension, and a
        # validation-only keyword held under the validation-only carve-out. A trailing zero
        # is significant here in a way it is not to a float — 1.10 and 1.1 are
        # the same number and different source text.
        preserved:
          type: number
          x-precise-limit: 123456789012345678901234567890
          x-precise-step: 1.000000000000000000001
          x-precise-scale: 1.10
          not:
            const: 123456789012345678901234567890
