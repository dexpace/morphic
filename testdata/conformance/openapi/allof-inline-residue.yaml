openapi: 3.1.0
info: {title: AllOfInlineResidue, version: "1.0.0"}
paths: {}
components:
  schemas:
    Base:
      type: object
      properties:
        id: {type: string}
    # The inline branch contributes its properties, and its description and
    # cardinality bound read as written beside the allOf. Nothing reads its
    # catch-all, so that survives beside the composed model, in the whole branch.
    Narrowed:
      allOf:
        - {$ref: '#/components/schemas/Base'}
        - type: object
          properties:
            name: {type: string}
          additionalProperties: false
          description: A narrowed base.
          maxProperties: 3
    # Untyped constrains objects and writes no type, so a string satisfies it.
    Untyped:
      properties:
        id: {type: string}
    # This branch declares a type that cannot be an object, which the composed
    # model asserts it is — the same residue, reported one severity higher. It
    # composes Untyped: beside the Base the conjuncts would share no value, and
    # allof-disjoint-conjuncts would report that once at the schema, leaving the
    # branch an info.
    Contradicted:
      allOf:
        - {$ref: '#/components/schemas/Untyped'}
        - {type: string, maxLength: 3}
