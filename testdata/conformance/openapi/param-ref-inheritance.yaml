openapi: 3.1.0
info: {title: ParamRefInheritance, version: "1.0.0"}
paths:
  /items:
    get:
      operationId: listItems
      parameters:
        # Inherits docs, deprecation and default from the referent.
        - {name: cursor, in: query, schema: {$ref: '#/components/schemas/Cursor'}}
        # The use site declares both, so the use site wins.
        - name: override
          in: query
          schema:
            $ref: '#/components/schemas/Cursor'
            description: Cursor for this endpoint only.
            default: "9"
            # A bound is the one keyword the use site does not take over: this
            # one lands here and the referent's 64 stays on the referent, both
            # in force, since bounds conjoin rather than override.
            maxLength: 100
      responses:
        "200":
          description: ok
components:
  schemas:
    Cursor:
      type: string
      title: Cursor
      description: Opaque pagination cursor.
      deprecated: true
      default: "0"
      maxLength: 64
    # The property form of the same references: what a parameter inherits, a
    # property inherits identically, and constraints cross to neither.
    Holder:
      type: object
      properties:
        cursor: {$ref: '#/components/schemas/Cursor'}
        override:
          $ref: '#/components/schemas/Cursor'
          maxLength: 100
