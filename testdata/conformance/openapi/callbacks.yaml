openapi: 3.1.0
info: {title: Callbacks, version: "1.0.0"}
paths:
  /subscribe:
    post:
      operationId: subscribe
      responses:
        "200":
          description: ok
      callbacks:
        onEvent:
          '{$request.body#/callbackUrl}':
            # A callback path item carries servers like any other path item.
            servers:
              - url: https://callbacks.example.com
            post:
              operationId: onEvent
              responses:
                "200":
                  description: ok
