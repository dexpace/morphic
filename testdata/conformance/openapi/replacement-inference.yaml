# A deprecation whose message names what to use instead fills ReplacedBy under
# the replacement policy, marked as inferred: an operation's by the method and
# path of an operation the document declares, a property's and a parameter's
# by a code span naming a member of its model or a parameter of its operation.
# A message naming something the document does not declare fills nothing, and
# keeps its prose; one naming such a name beside a member it declares is
# reported as undecided. A name is read only where a phrase introduces it as a
# replacement: one a message mentions to say what a deprecated entity differs
# from, was called, replaced or must not be used for is read as no
# replacement.
openapi: 3.1.0
info: {title: ReplacementInference, version: "1.0.0"}
