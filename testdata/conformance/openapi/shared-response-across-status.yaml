# One components/responses entry mounted at both a success and an error status.
# The two mounts lower through different functions — lowerResponse and
# lowerErrorCase — and both intern the body type at the same declaration
# pointer, so whichever runs first mints it and the other's naming hint is
# discarded. Without this fixture nothing in the corpus asks the question: no
# other committed spec reaches one response component from both sides of the
# success/error boundary, so the order-invariance oracle never fires on it.
openapi: 3.1.0
info: {title: SharedResponseAcrossStatus, version: "1"}
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        "200": {$ref: '#/components/responses/Envelope'}
        "404": {$ref: '#/components/responses/Envelope'}
components:
  responses:
    Envelope:
      description: the same envelope, whatever the status
      content:
        application/json:
          schema:
            type: object
            properties:
              message: {type: string}
