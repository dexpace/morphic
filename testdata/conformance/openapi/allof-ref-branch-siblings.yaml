openapi: 3.1.0
info: {title: AllOfRefBranchSiblings, version: "1.0.0"}
paths: {}
components:
  schemas:
    Base:
      type: object
      properties: {a: {type: string}}
    Extra:
      type: object
      properties: {b: {type: string}}
    Annotated:
      allOf:
        - $ref: '#/components/schemas/Base'
          description: Base as this composition uses it
          minProperties: 3
          x-vendor: keepme
      type: object
      properties: {c: {type: string}}
    Mixed:
      allOf:
        - $ref: '#/components/schemas/Base'
          description: narrowed here
        - $ref: '#/components/schemas/Extra'
    Bare:
      allOf:
        - $ref: '#/components/schemas/Base'
    # A branch's own $ref conjoins with oneOf/anyOf or a nested allOf exactly
    # as a component's or a carrier's does, but fillAllOf's branch census
    # (unhomedKeywords) never named any of the three: these composed straight
    # to Base with the sibling read by nothing — no alias, no Unmodeled, no
    # diagnostic (GitHub #406).
    UnionBranch:
      allOf:
        - $ref: '#/components/schemas/Base'
          oneOf: [{type: string}, {type: integer}]
      type: object
      properties: {d: {type: string}}
    NestedAllOfBranch:
      allOf:
        - $ref: '#/components/schemas/Base'
          allOf: [{type: string}]
      type: object
      properties: {e: {type: string}}
