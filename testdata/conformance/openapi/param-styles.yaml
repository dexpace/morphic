openapi: 3.1.0
info: {title: ParamStyles, version: "1.0.0"}
paths:
  /search:
    parameters:
      - name: requestId
        in: header
        schema: {type: string, enum: [a, b]}
    get:
      operationId: search
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema: {type: object}
        - {name: path, in: query, allowReserved: true, schema: {type: string}}
        - name: payload
          in: query
          content:
            application/json:
              schema: {type: object}
      responses:
        "200":
          description: ok
    delete:
      operationId: clearSearch
      responses:
        "200":
          description: ok
