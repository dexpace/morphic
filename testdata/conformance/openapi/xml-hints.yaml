openapi: 3.1.0
info: {title: XMLHints, version: "1.0.0"}
paths: {}
components:
  schemas:
    Book:
      type: object
      xml: {name: book, namespace: 'urn:example:books', prefix: bk}
      properties:
        # A scalar property keeps its hints on the property itself.
        isbn:
          type: string
          xml: {attribute: true, namespace: 'urn:example:books', prefix: bk}
        # A property using an attribute type as it is, and one declaring its node
        # an element beside the $ref, which overrides the type's flag.
        lang: {$ref: '#/components/schemas/Lang'}
        title: {$ref: '#/components/schemas/Lang', xml: {attribute: false}}
        # An array hoists a node of its own, which is where its hints land.
        authors:
          type: array
          xml: {name: authors, wrapped: true}
          items: {type: string, xml: {name: author}}
    Lang:
      type: string
      xml: {attribute: true}
