openapi: 3.1.0
info: {title: StreamingMedia31, version: "1.0.0"}
paths:
  /ingest:
    post:
      operationId: ingestRows
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: object
              properties:
                row: {type: string}
      responses:
        "200":
          description: ok
          content:
            text/event-stream; charset=utf-8:
              schema:
                type: object
                properties:
                  ack: {type: string}
  # A request that streams beside a response that does not.
  /upload:
    post:
      operationId: uploadRows
      requestBody:
        content:
          application/x-ndjson:
            schema: {$ref: '#/components/schemas/Frame'}
      responses:
        "204":
          description: ingested
  /mixed:
    get:
      operationId: streamEither
      responses:
        "200":
          description: ok
          content:
            application/x-ndjson:
              schema:
                type: object
                properties:
                  row: {type: string}
            application/jsonl:
              schema:
                type: object
                properties:
                  line: {type: string}
  # Content negotiation: one element offered under two streaming media types.
  # Every candidate names the same type, so there is nothing to elect between
  # and the element is named — the refusal above is for contents that disagree,
  # not for a direction that happens to have more than one.
  /negotiated:
    get:
      operationId: streamNegotiated
      responses:
        "200":
          description: ok
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/Frame'}
            application/x-ndjson:
              schema: {$ref: '#/components/schemas/Frame'}
  # A registered sequence type (RFC 7464), and its structured suffix (RFC 8091).
  /sequence:
    get:
      operationId: streamSequence
      responses:
        "200":
          description: ok
          content:
            application/json-seq:
              schema: {$ref: '#/components/schemas/Frame'}
  /sequence-suffix:
    post:
      operationId: uploadSequence
      requestBody:
        content:
          application/geo+json-seq:
            schema: {$ref: '#/components/schemas/Frame'}
      responses:
        "204": {description: ok}
components:
  schemas:
    Frame:
      type: object
      properties:
        seq: {type: integer}
