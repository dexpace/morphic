openapi: 3.1.0
info: {title: StreamingMedia31, version: "1.0.0"}
paths:
  /ingest:
    post:
      operationId: ingestRows
      requestBody:
        content:
          application/x-ndjson:
            schema:
              type: object
              properties:
                row: {type: string}
      responses:
        "200":
          description: ok
          content:
            text/event-stream; charset=utf-8:
              schema:
                type: object
                properties:
                  ack: {type: string}
  /mixed:
    get:
      operationId: streamEither
      responses:
        "200":
          description: ok
          content:
            application/x-ndjson:
              schema:
                type: object
                properties:
                  row: {type: string}
            application/jsonl:
              schema:
                type: object
                properties:
                  line: {type: string}
