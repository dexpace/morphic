openapi: 3.2.0
info: {title: ComponentMediaTypes32, version: "1.0.0"}
paths:
  /events:
    get:
      operationId: listEvents
      responses:
        "200":
          description: ok
          content:
            # A content entry may reference a reusable Media Type Object, which
            # lowers once, at its own pointer, however many entries name it.
            # The summary beside the $ref documents this use of it.
            application/json: {$ref: '#/components/mediaTypes/Event', summary: Every event.}
  /events/{id}:
    get:
      operationId: getEvent
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: ok
          content:
            # An entry that is itself a $ref is followed to the one it names.
            application/json: {$ref: '#/components/mediaTypes/EventAlias'}
components:
  schemas:
    Event:
      type: object
      properties: {id: {type: string}}
  examples:
    One: {value: {id: e1}}
  mediaTypes:
    Event:
      description: One event.
      schema: {$ref: '#/components/schemas/Event'}
      examples:
        one: {$ref: '#/components/examples/One'}
      x-note: from the component
    EventAlias: {$ref: '#/components/mediaTypes/Event'}
    # An entry no content entry references is kept on the document.
    Unused: {schema: {type: string}}
