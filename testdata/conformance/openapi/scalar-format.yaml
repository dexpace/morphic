openapi: 3.1.0
info: {title: ScalarFormat, version: "1.0.0"}
paths: {}
components:
  schemas:
    Holder:
      type: object
      properties:
        # The bound is declared beside the unknown format on purpose: the format
        # hoists a node of its own, which is what stops the shared alias path
        # attaching the position's constraints afterwards.
        color: {type: string, format: hex-color, minLength: 4}
        # A password format is a redaction request, not just an encoding.
        token: {type: string, format: password}
        # An integer width selects the primitive the IR has for it, under
        # either numeric type: OpenAPI applies a format to integers and other
        # numbers alike, and registers the widths under number.
        small: {type: integer, format: int8}
        count: {type: number, format: uint32}
        i16: {type: integer, format: int16}
        i32: {type: integer, format: int32}
        i64: {type: integer, format: int64}
        u8: {type: integer, format: uint8}
        u16: {type: integer, format: uint16}
        u64: {type: integer, format: uint64}
        # A float or decimal format selects its primitive under number alone.
        f32: {type: number, format: float}
        f64: {type: number, format: double}
        amount: {type: number, format: decimal}
        big: {type: number, format: decimal128}
        # A string format the table names selects a primitive and hoists nothing.
        at: {type: string, format: date-time}
        starts: {type: string, format: date-time-local}
        closes: {type: string, format: time-local}
        ttl: {type: string, format: duration}
        # A time is an RFC 3339 full-time, whose offset the time primitive does
        # not hold, so it keeps its format on a Scalar, as an unknown one does.
        opens: {type: string, format: time}
        # A float format on an integer admits only its integral values, which
        # no primitive narrower than integer holds, so the format is kept.
        whole: {type: integer, format: double}
        # A number's format on a string names a number written as its text:
        # the number is the logical type and the string what it travels as.
        id: {type: string, format: int64}
        price: {type: string, format: decimal}
        # A registered format whose value is of another primitive than the
        # JSON type it is written on hoists a Scalar over that primitive, under
        # the encoding the IR names its text by, as byte does: URL-safe base64
        # bytes, an instant as an HTTP-date, and an instant as its seconds,
        # whose JSON type is the wire type.
        thumbprint: {type: string, format: base64url}
        modified: {type: string, format: http-date, minLength: 29}
        resetAt: {type: integer, format: unixtime, minimum: 0}
        seenAt: {type: number, format: unixtime}
        issuedAt: {type: string, format: unixtime}
