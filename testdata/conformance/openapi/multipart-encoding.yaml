openapi: 3.1.0
info: {title: MultipartEncoding, version: "1.0.0"}
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                tags:
                  type: array
                  items: {type: string}
            encoding:
              file:
                contentType: image/png
                headers:
                  X-Part-Id:
                    description: per-part correlation id
                    required: true
                    schema: {type: string, format: uuid}
                  X-Part-Checksum: {$ref: '#/components/headers/PartChecksum'}
      responses:
        "200":
          description: ok
  # The same wire format written as a composition rather than a declaration. A
  # body whose parts arrive through allOf has no properties of its own, so the
  # parts must be enumerated across the composition and keyed by the property
  # the IR actually holds — which docs/ir/models.md#composition keeps on the Base, not on the composed
  # node.
  /upload-composed:
    post:
      operationId: uploadComposed
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - {$ref: '#/components/schemas/UploadForm'}
                - type: object
                  properties:
                    note: {type: string}
            encoding:
              file: {contentType: image/png}
              note: {contentType: text/plain}
      responses:
        "200":
          description: ok
  # A part two composed models declare is one part on the wire, keyed by the
  # declaration the body's flattening takes (docs/ir/models.md#the-flattening): the later
  # conjunct's, FileList's list of files here, whose type the flags read.
  /upload-redeclared:
    post:
      operationId: uploadRedeclared
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - {$ref: '#/components/schemas/UploadForm'}
                - {$ref: '#/components/schemas/FileList'}
            encoding:
              file: {contentType: image/png}
      responses:
        "200":
          description: ok
  /submit:
    post:
      operationId: submitForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: {type: string}
            encoding:
              # allowReserved sits beside style and explode in the source and
              # lowers beside them onto the ir.PartEncoding, as a parameter's
              # does onto its binding, instead of vanishing (GitHub #291).
              ids: {style: form, explode: true, allowReserved: true}
      responses:
        "200":
          description: ok
components:
  schemas:
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    FileList:
      type: object
      properties:
        file:
          type: array
          items: {type: string, format: binary}
    UploadForm:
      type: object
      properties:
        file: {type: string, format: binary}
        tags:
          type: array
          items: {type: string}
  headers:
    PartChecksum:
      description: sha-256 digest of this part
      schema: {$ref: '#/components/schemas/Digest'}
