openapi: 3.1.0
info: {title: MultipartEncoding, version: "1.0.0"}
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                tags:
                  type: array
                  items: {type: string}
            encoding:
              file:
                contentType: image/png
                headers:
                  X-Part-Id:
                    description: per-part correlation id
                    required: true
                    schema: {type: string, format: uuid}
                  X-Part-Checksum: {$ref: '#/components/headers/PartChecksum'}
      responses:
        "200":
          description: ok
  /submit:
    post:
      operationId: submitForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: {type: string}
            encoding:
              ids: {style: form, explode: true}
      responses:
        "200":
          description: ok
components:
  schemas:
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
  headers:
    PartChecksum:
      description: sha-256 digest of this part
      schema: {$ref: '#/components/schemas/Digest'}
