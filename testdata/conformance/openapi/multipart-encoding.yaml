openapi: 3.1.0
info: {title: MultipartEncoding, version: "1.0.0"}
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                tags:
                  type: array
                  items: {type: string}
            encoding:
              file:
                contentType: image/png
                headers:
                  X-Part-Id:
                    description: per-part correlation id
                    required: true
                    schema: {type: string, format: uuid}
                  X-Part-Checksum: {$ref: '#/components/headers/PartChecksum'}
      responses:
        "200":
          description: ok
  # The same wire format written as a composition rather than a declaration. A
  # body whose parts arrive through allOf has no properties of its own, so the
  # parts must be enumerated across the composition and keyed by the property
  # the IR actually holds — which §4.3 keeps on the Base, not on the composed
  # node.
  /upload-composed:
    post:
      operationId: uploadComposed
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - {$ref: '#/components/schemas/UploadForm'}
                - type: object
                  properties:
                    note: {type: string}
            encoding:
              file: {contentType: image/png}
              note: {contentType: text/plain}
      responses:
        "200":
          description: ok
  /submit:
    post:
      operationId: submitForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: {type: string}
            encoding:
              # allowReserved sits beside style and explode in the source and has
              # no ir.PartEncoding field, where those two do; it is kept verbatim
              # on the content instead of vanishing (GitHub #291).
              ids: {style: form, explode: true, allowReserved: true}
      responses:
        "200":
          description: ok
components:
  schemas:
    Digest:
      type: string
      pattern: '^[0-9a-f]{64}$'
    UploadForm:
      type: object
      properties:
        file: {type: string, format: binary}
        tags:
          type: array
          items: {type: string}
  headers:
    PartChecksum:
      description: sha-256 digest of this part
      schema: {$ref: '#/components/schemas/Digest'}
