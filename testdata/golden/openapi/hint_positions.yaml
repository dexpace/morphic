# The positions within one document that the OpenAPI compiler composes a hint
# from, one for each way the naming composes one. A hint is what an emitter
# renders an unnamed node's identifier from, so ir/testdata/names.golden.txt
# lists each one here and IRVersion is pinned to that list
# (docs/ir/ir-version.md). A document a $ref reads whole is named too,
# and one file cannot write that position. The root declares no server because
# the one OpenAPI then supplies is a position of its own. Roles repeat under each
# kind of owner because the owner decides them: beneath a component schema, a
# hint read from the pointer alone reads the same.
openapi: 3.2.0
info: {title: Hint positions, version: 1.0.0}
tags:
  - name: pets
paths:
  /pets/{petId}:
    servers:
      - url: https://api.example.com/v1
      - url: /
    get:
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema: {type: object, properties: {id: {type: string}}}
        - name: X-Trace
          in: header
          content:
            application/json:
              schema: {type: object, properties: {span: {type: string}}}
      responses:
        '200':
          description: ok
          headers:
            X-Rate:
              schema: {type: object, properties: {left: {type: integer}}}
            X-Page:
              content:
                application/json:
                  schema: {type: object, properties: {next: {type: string}}}
          content:
            application/json:
              schema: {type: object, properties: {name: {type: string}}}
        '404': {description: missing}
        4XX: {description: client}
        5XX: {description: server}
        default: {description: fallback}
  /pets:
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {name: {type: string}}}
      responses:
        '201': {$ref: '#/components/responses/Created'}
  /uploads:
    post:
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {size: {type: integer}}}
      responses:
        '204': {description: stored}
    put:
      operationId: replaceUpload
      requestBody: {$ref: '#/components/requestBodies/Upload'}
      parameters:
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '204':
          description: stored
          headers:
            X-Trace: {$ref: '#/components/headers/Trace'}
  /subscriptions:
    post:
      operationId: subscribe
      callbacks:
        onEvent:
          '{$request.body#/url}':
            post:
              requestBody:
                content:
                  application/json:
                    schema: {type: object, properties: {x: {type: string}}}
              responses:
                '200': {description: seen}
        onShared: {$ref: '#/components/callbacks/Shared'}
      responses:
        '201': {description: subscribed}
  /forms:
    post:
      operationId: submitForm
      requestBody:
        content:
          multipart/form-data:
            schema: {type: object, properties: {part: {type: string}}}
            encoding:
              part:
                headers:
                  X-Part:
                    schema: {type: object, properties: {y: {type: string}}}
                  X-Meta:
                    content:
                      application/json:
                        schema: {type: object, properties: {z: {type: string}}}
      responses:
        '204': {description: stored}
  /shared: {$ref: '#/components/pathItems/Shared'}
  /structures:
    get:
      parameters:
        - name: filter
          in: query
          schema: {type: array, items: {type: object, properties: {ca: {type: string}}}}
        - {$ref: '#/components/schemas/Positions/x-parameter'}
      responses:
        '200':
          description: ok
          headers:
            X-List:
              schema: {type: array, items: {type: object, properties: {cb: {type: string}}}}
          content:
            application/json:
              schema: {type: array, items: {type: object, properties: {cc: {type: string}}}}
            application/yaml:
              schema:
                type: object
                additionalProperties: {type: object, properties: {cd: {type: string}}}
                patternProperties: {'^y': {type: object, properties: {ce: {type: string}}}}
            text/csv:
              schema:
                type: array
                prefixItems:
                  - {type: object, properties: {cf: {type: string}}}
            application/xml:
              schema:
                oneOf:
                  - {type: object, properties: {cg: {type: string}}}
                  - {type: string}
        '201': {$ref: '#/components/schemas/Positions/x-response'}
    post:
      operationId: makeStructure
      requestBody:
        content:
          application/json:
            schema: {type: array, items: {type: object, properties: {ch: {type: string}}}}
      responses:
        '204': {description: stored}
    put:
      requestBody: {$ref: '#/components/schemas/Positions/x-body'}
      responses:
        '204': {description: stored}
  /events:
    get:
      operationId: events
      responses:
        '200':
          description: ok
          content:
            application/jsonl:
              itemSchema: {type: object, properties: {at: {type: string}}}
webhooks:
