openapi: 3.1.0
info: {title: Split Petstore pets, version: "1.0.0"}
paths: {}
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        tag: {$ref: '#/components/schemas/Tag'}
        status: {type: string, enum: [available, sold]}
    Tag:
      type: object
      properties:
        label: {type: string}
