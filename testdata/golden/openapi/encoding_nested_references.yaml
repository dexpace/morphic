# References written beneath the Encoding Objects OpenAPI 3.2 nests under
# another's encoding, prefixEncoding and itemEncoding, and references into
# them. Each nested field holds a header that references a component header,
# and headers whose schemas reference a component schema and a schema kept
# under an extension. A component schema and a response header reference
# positions beneath a nested Encoding Object.
openapi: 3.2.0
info: {title: Nested encoding references, version: "1"}
paths:
  /parts:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                doc: {type: object, properties: {inner: {type: string}}}
                parts: {type: array, items: {type: string}}
            encoding:
              doc:
                contentType: multipart/form-data
                encoding:
                  inner:
                    headers:
                      X-Shared: {$ref: '#/components/headers/Shared'}
                      X-Component: {schema: {$ref: '#/components/schemas/Part'}}
                      X-Kept: {schema: {$ref: '#/x-defs/Kept'}}
                      X-Inner:
                        schema: {type: array, items: {type: object, properties: {i: {type: string}}}}
              parts:
                contentType: multipart/mixed
                prefixEncoding:
                  - headers:
                      X-Shared: {$ref: '#/components/headers/Shared'}
                      X-Component: {schema: {$ref: '#/components/schemas/Part'}}
                      X-Kept: {schema: {$ref: '#/x-defs/Kept'}}
                itemEncoding:
                  headers:
                    X-Shared: {$ref: '#/components/headers/Shared'}
                    X-Component: {schema: {$ref: '#/components/schemas/Part'}}
                    X-Kept: {schema: {$ref: '#/x-defs/Kept'}}
      responses:
        '200':
          description: ok
          headers:
            X-Back:
              $ref: '#/paths/~1parts/post/requestBody/content/multipart~1form-data/encoding/doc/encoding/inner/headers/X-Inner'
components:
  headers:
    Shared: {schema: {type: integer}}
  schemas:
    Part: {type: string}
    Into:
      $ref: '#/paths/~1parts/post/requestBody/content/multipart~1form-data/encoding/doc/encoding/inner/headers/X-Inner/schema/items'
x-defs:
  Kept: {type: object, properties: {k: {type: string}}}
