version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - containedctx # a context is a parameter, never a struct field
    - copyloopvar
    - depguard # encoding/json v1, refused in every file
    - errname # Err… sentinels and …Error types
    - errorlint # %w discipline: errors.Is/As over == and type assertions
    - exhaustive # a switch over an IR enum names every member
    - forbidigo # no stdout, stderr or logging from a pipeline stage
    - forcetypeassert # comma-ok on every type assertion outside tests
    - funlen # the styleguide's 70-line cap, enforced rather than declared
    - gocognit # nesting-weighted complexity: the reason the cap is 70 and not 200
    - gocritic # its default checks, and the ruleguard rules in internal/lintrules
    - godot # a doc comment is sentences, so it ends with a period
    - intrange # for i := range n, where a counted loop only counts
    - misspell
    - modernize # the standard library and language forms go fix and the modernize analyzers propose
    - nilerr
    - prealloc
    - predeclared # no declaration shadows a builtin
    - revive
    - unconvert
    - unparam
    - usestdlibvars # http.MethodGet over "GET", and the like
    - usetesting # t.Context, t.Chdir and t.TempDir over their context and os spellings
  settings:
    depguard:
      rules:
        # encoding/json is v1. The IR's bytes are decided by ir.Document through
        # encoding/json/v2, and every v1 call runs v2 under DefaultOptionsV1: HTML
        # escaping, invalid UTF-8 rewritten to U+FFFD, duplicate names accepted,
        # names matched case-insensitively. One v1 call reintroduces that at
        # whatever it touches, and a test reaching v1 checks the IR against a codec
        # it no longer uses, so tests are covered too. The trailing $ makes the
        # match exact: a prefix would refuse v2 and jsontext with it.
        #
        # Lint reads the files the host's build includes, so a file built only for
        # another port, such as one tagged windows, is not checked.
        json-v1:
          list-mode: lax
          files: [$all]
          deny:
            - pkg: encoding/json$
              desc: use encoding/json/v2 and encoding/json/jsontext
    exhaustive:
      # A switch over one of the IR's enums names every member, default or not:
      # a guessing default absorbs a new kind as whatever it asserts, and
      # ir.ValueKind is a bare string enum with no marker method to hold it
      # otherwise. Only package ir's enums are held. The rest are ignored by
      # pattern: the standard library (no dot in its path), the libraries the
      # module reads, and every package of the module but ir (its path after
      # morphic/ is anything but exactly ir). A switch over a library's enum
      # reads the few members it handles, so an enum from a library newly
      # imported is held until it is named here.
      default-signifies-exhaustive: false
      ignore-enum-types: ^([^.]+|gopkg\.in/yaml\.v3|github\.com/speakeasy-api/openapi/.+|github\.com/dexpace/morphic/([^i.][^.]*|i[^r.][^.]*|ir[^.]+|i))\.\w+$
    forbidigo:
      # Invariant 5: a pipeline stage writes nothing to stdout or stderr and
      # logs nothing. It returns diagnostics, and the engine or the CLI decides
      # what is shown. An exclusion below confines these to the pipeline's
      # packages. An injected *slog.Logger stays allowed: only the package-level
      # functions writing through the default logger are refused.
      analyze-types: true
      forbid:
        - pattern: ^os\.(Stdout|Stderr)$
          pkg: ^os$
        - pattern: ^fmt\.Print(f|ln)?$
          pkg: ^fmt$
        - pattern: ^print(ln)?$
        - pattern: ^log\.
          pkg: ^log$
        - pattern: ^slog\.(Default|SetDefault|Debug|DebugContext|Info|InfoContext|Warn|WarnContext|Error|ErrorContext|Log|LogAttrs)$
          pkg: ^log/slog$
    funlen:
      # The styleguide's hard cap. Statements are not capped as well: a function
      # is long because of what it does, and two limits on the same axis only
      # means the tighter one is the rule and the other is noise.
      lines: 70
      statements: -1
      ignore-comments: true
    gocognit:
      # Calibrated against the finished tree, whose worst function scores 21.
      # Raising this is how a function that should have been split stays whole,
      # so a failure is a prompt to name the inner step, not to move the number.
      min-complexity: 20
    gocritic:
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # Without failOn, ruleguard skips a rules file it cannot load and runs
          # whatever else it has; with it, the load error fails the run and names
          # the line.
          failOn: all
          rules: ${base-path}/internal/lintrules/rules.go
    revive:
      rules:
        - name: exported # GoDoc on every exported symbol
        - name: package-comments
        # A local that shadows an imported package compiles until someone adds a
        # call to that package below it. compilers/openapi had one live instance.
        - name: import-shadowing
  exclusions:
    # A suppression is a rule here, with its reason beside it, and never a comment
    # in the source: internal/archtest refuses those. Keep each rule as narrow as
    # the finding it excuses, which is a path and, where the linter says more than
    # one thing there, the message; delete it with the code it excuses.
    # golangci-lint warns about a rule that skipped nothing but does not fail on it;
    # a run narrowed to some packages warns about each rule it did not reach.
    warn-unused: true
    rules:
      # A table-driven test is long because its table is long, and the table is
      # data. Splitting one to satisfy a size cap moves cases away from the
      # assertion that reads them, which is the opposite of what the cap is for.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
      # A unix socket path is capped near 104 bytes and t.TempDir spells the
      # whole test name into its path, so this test builds a short one itself.
      - path: internal/harness/path_test\.go
        linters:
          - usetesting
        text: os\.MkdirTemp
      # forbidigo's rules are invariant 5's, which binds the pipeline: ir,
      # compilers, pass and engine, beside the plants that hold the rules.
      - path-except: ^(ir|compilers|pass|engine|internal/lintrules/testdata)/
        linters:
          - forbidigo
      # A test may print, and a forced type assertion in one fails the test by
      # panicking, which is what an assertion is for there. The comma-ok rule
      # keeps a panic from escaping a package to its callers.
      - path: _test\.go
        linters:
          - forbidigo
          - forcetypeassert
      # liveForCalls is a context.Context: it embeds the one it wraps to answer Err
      # on a schedule, which is how a context decorator is written, not a context
      # held for later.
      - path: compilers/openapi/budgets_test\.go
        linters:
          - containedctx
        source: ^\s*context\.Context$
      # keyed runs as pointer reads step through models, and the Type.Fields
      # range this proposes costs it four allocations a call where indexing
      # costs none. TestKeyed_CostsNoAllocation holds it there.
      - path: compilers/openapi/internal/navigation/navigation\.go
        linters:
          - modernize
        text: stditerators
      # A compile.Settlement may rewrite a node the walk interned, through the
      # registry compile.Types.Settle hands it, which refuses one that changes the
      # node count (compilers/compile/settle.go). This line is that rewrite: the
      # framework's way in, not a way around it.
      - path: compilers/openapi/internal/schema/discriminated\.go
        linters:
          - gocritic
        text: writes an ir\.TypeRegistry
        source: reg\[d\.model\] = mt

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/dexpace/morphic)
