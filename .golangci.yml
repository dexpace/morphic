version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - errorlint # %w discipline: errors.Is/As over == and type assertions
    - funlen # the styleguide's 70-line cap, enforced rather than declared
    - gocognit # nesting-weighted complexity: the reason the cap is 70 and not 200
    - gocritic
    - misspell
    - nilerr
    - nolintlint # a suppression outliving what it suppressed is invisible without this
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    funlen:
      # The styleguide's hard cap. Statements are not capped as well: a function
      # is long because of what it does, and two limits on the same axis only
      # means the tighter one is the rule and the other is noise.
      lines: 70
      statements: -1
      ignore-comments: true
    nolintlint:
      # A directive that suppresses nothing reads as a live constraint on the code
      # under it, and nothing else in the gate can tell the two apart: the tree
      # stays green whether the finding is real or long gone. Each of these makes
      # one way of writing an inert directive fail instead.
      #
      # allow-unused only reaches directives naming an ENABLED linter. One naming a
      # disabled or nonexistent linter is ignored by the nolint processor and
      # reported by nothing — which is how //nolint:forcetypeassert stood here
      # without ever suppressing anything. scripts/check-nolint-linters.sh closes
      # that, cross-checking every name against the set this file leaves enabled.
      allow-unused: false # it no longer suppresses anything — delete it
      require-specific: true # bare //nolint hides findings nobody chose to accept
      require-explanation: true # the rationale is what a later reader re-checks against
    gocognit:
      # Calibrated against the finished tree, whose worst function scores 21.
      # Raising this is how a function that should have been split stays whole,
      # so a failure is a prompt to name the inner step, not to move the number.
      min-complexity: 20
    revive:
      rules:
        - name: exported # GoDoc on every exported symbol
        - name: package-comments
        # A local that shadows an imported package compiles until someone adds a
        # call to that package below it. compilers/openapi had one live instance.
        - name: import-shadowing
  exclusions:
    rules:
      # A table-driven test is long because its table is long, and the table is
      # data. Splitting one to satisfy a size cap moves cases away from the
      # assertion that reads them, which is the opposite of what the cap is for.
      - path: _test\.go
        linters:
          - funlen
          - gocognit

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/dexpace/morphic)
