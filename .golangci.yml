version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bidichk # no bidirectional Unicode control, which makes source read otherwise than it compiles
    - containedctx # a context is a parameter, never a struct field
    - copyloopvar
    - depguard # encoding/json v1, refused in every file
    - durationcheck # no time.Duration multiplied by another
    - errname # Err… sentinels and …Error types
    - errorlint # %w discipline: errors.Is/As over == and type assertions
    - exhaustive # a switch over an IR enum names every member
    - fatcontext # no context wrapped again on each turn of a loop
    - forbidigo # no stdout, stderr or logging from a pipeline stage
    - forcetypeassert # comma-ok on every type assertion outside tests
    - funlen # the styleguide's 70-line cap, enforced rather than declared
    - gocheckcompilerdirectives # a //go: directive the compiler knows, not one it silently ignores
    - gochecknoinits # no init: package state set at load time is what invariant 5 rules out
    - gocognit # nesting-weighted complexity: the reason the cap is 70 and not 200
    - gocritic
    - godot # a doc comment is sentences, so it ends with a period
    - intrange # for i := range n, where a counted loop only counts
    - makezero # no append to a slice made with a non-zero length
    - misspell
    - modernize # the standard library and language forms go fix and the modernize analyzers propose
    - nilerr
    - nilnesserr # no nil error returned where a checked one was meant
    - prealloc
    - predeclared # no declaration shadows a builtin
    - reassign # no assignment to another package's variable
    - revive
    - tagliatelle # JSON and YAML field names in the IR's Go-style camel case
    - testifylint # testify assertions in the forms that say most when they fail
    - unconvert
    - unparam
    - usestdlibvars # http.MethodGet over "GET", and the like
    - usetesting # t.Context, t.Chdir and t.TempDir over their context and os spellings
  settings:
    depguard:
      rules:
        # encoding/json is v1. The IR's bytes are decided by ir.Document through
        # encoding/json/v2, and every v1 call runs v2 under DefaultOptionsV1: HTML
        # escaping, invalid UTF-8 rewritten to U+FFFD, duplicate names accepted,
        # names matched case-insensitively. One v1 call reintroduces that at
        # whatever it touches, and a test reaching v1 checks the IR against a codec
        # it no longer uses, so tests are covered too. The trailing $ makes the
        # match exact: a prefix would refuse v2 and jsontext with it.
        json-v1:
          list-mode: lax
          files: [$all]
          deny:
            - pkg: encoding/json$
              desc: use encoding/json/v2 and encoding/json/jsontext
    exhaustive:
      # A switch over one of the IR's enums names every member, default or not:
      # a guessing default absorbs a new kind as whatever it asserts, and
      # ir.ValueKind is a bare string enum with no marker method to hold it
      # otherwise. Only package ir's enums are held. The rest are ignored by
      # pattern: the standard library (no dot in its path), the two libraries
      # whose enums the module switches over, and every package of the module
      # but ir (its path after morphic/ is anything but exactly ir). A switch
      # over a library's enum names the few members it handles, so an enum of
      # any other library is held until it is named here. An arm whose value no
      # member declares is not refused: it is dead, and a literal spelling a
      # member's value does not count as naming that member.
      default-signifies-exhaustive: false
      ignore-enum-types: ^([^.]+|go\.yaml\.in/yaml/v3|github\.com/speakeasy-api/openapi/.+|github\.com/dexpace/morphic/([^i.][^.]*|i[^r.][^.]*|ir[^.]+|i))\.\w+$
    forbidigo:
      # Invariant 5: a pipeline stage writes nothing to stdout or stderr and
      # logs nothing. It returns diagnostics, and the engine or the CLI decides
      # what is shown. An exclusion below confines these to the pipeline's
      # packages. Named here is every standard-library way to reach stdout or
      # stderr without being handed a writer, and the default loggers. An
      # injected *slog.Logger stays allowed: only the package-level functions
      # writing through the default logger are refused, as is opening a
      # connection to the system log.
      analyze-types: true
      forbid:
        - pattern: ^os\.(Stdout|Stderr)$
          pkg: ^os$
        - pattern: ^syscall\.(Stdout|Stderr)$
          pkg: ^syscall$
        - pattern: ^debug\.PrintStack$
          pkg: ^runtime/debug$
        - pattern: ^fmt\.Print(f|ln)?$
          pkg: ^fmt$
        - pattern: ^print(ln)?$
        - pattern: ^log\.
          pkg: ^log$
        - pattern: ^slog\.(Default|SetDefault|Debug|DebugContext|Info|InfoContext|Warn|WarnContext|Error|ErrorContext|Log|LogAttrs)$
          pkg: ^log/slog$
        - pattern: ^syslog\.(New|Dial|NewLogger)$
          pkg: ^log/syslog$
        # Outside tests, a panic is recovered through barrier.Catch alone, in
        # every package. A hand-written recover quotes what it caught with no
        # bound on its length or its lines, and under GODEBUG=panicnil=1 takes
        # a panic(nil) for a return.
        - pattern: ^recover$
          msg: recover a panic through barrier.Catch
    funlen:
      # The styleguide's hard cap. Statements are not capped as well: a function
      # is long because of what it does, and two limits on the same axis only
      # means the tighter one is the rule and the other is noise.
      lines: 70
      statements: -1
      ignore-comments: true
    gocognit:
      # Calibrated against the finished tree, whose worst function scores 21.
      # Raising this is how a function that should have been split stays whole,
      # so a failure is a prompt to name the inner step, not to move the number.
      min-complexity: 20
    reassign:
      # Invariant 5 from the other side: a stage that sets another package's
      # variable shares state with everything else that reads it. Every name is
      # held, not only the Err… and EOF ones held by default. Tests, which swap
      # os.Args to drive a main, are excused below.
      patterns: [".*"]
    revive:
      rules:
        - name: exported # GoDoc on every exported symbol
        - name: package-comments
        # A local that shadows an imported package compiles until someone adds a
        # call to that package below it. compilers/openapi had one live instance.
        - name: import-shadowing
        # The styleguide's own rules that revive can state: the context first,
        # no else after a returning if, initialisms and receivers named alike,
        # no dot import, any over interface{}, the error last, and no exported
        # function returning an unexported type. Listing rules turns revive's
        # defaults off, so each is named.
        - name: context-as-argument
        - name: indent-error-flow
        - name: superfluous-else
        - name: early-return
        - name: var-naming
        - name: receiver-naming
        - name: dot-imports
        - name: use-any
        - name: error-return
        - name: unexported-return
        # Mistakes no test is sure to reach: a call that always recurses, an if
        # whose branches match, a named result a goroutine writes, and a
        # sync.WaitGroup passed by value.
        - name: unconditional-recursion
        - name: identical-branches
        - name: datarace
        - name: waitgroup-by-value
    tagliatelle:
      # The IR's JSON is its ABI, spelled as Go spells identifiers: wireID,
      # tokenURL. The shape pin catches a renamed field, not a field added in
      # another case. goCamel keeps initialisms whole where camel asks for wireId.
      case:
        rules:
          json: goCamel
          yaml: goCamel
    testifylint:
      # These checkers ask for what this repository does otherwise: require for
      # an error that is the value under test, where the styleguide asserts
      # values; JSONEq where the exact bytes are the point (invariant 7); a
      # delta for testing.AllocsPerRun's counts, whole numbers compared exactly;
      # the literal as the expected value, where a test compares what it read
      # before a step with the same composite read after; and assert.Nil, which
      # passes a typed nil in an interface that a test of one exists to refuse.
      disable:
        - require-error
        - encoded-compare
        - float-compare
        - expected-actual
        - nil-compare
  exclusions:
    # A suppression is a rule here, with its reason beside it, and never a comment
    # in the source: internal/archtest refuses those. Keep each rule as narrow as
    # the finding it excuses, which is a path and, where the linter says more than
    # one thing there, the message; delete it with the code it excuses.
    # golangci-lint warns about a rule that skipped nothing but does not fail on it;
    # a run narrowed to some packages warns about each rule it did not reach.
    warn-unused: true
    rules:
      # A table-driven test is long because its table is long, and the table is
      # data. Splitting one to satisfy a size cap moves cases away from the
      # assertion that reads them, which is the opposite of what the cap is for.
      - path: _test\.go
        linters:
          - funlen
          - gocognit
      # A unix socket path is capped near 104 bytes and t.TempDir spells the
      # whole test name into its path, so this test builds a short one itself.
      - path: internal/harness/path_test\.go
        linters:
          - usetesting
        text: os\.MkdirTemp
      # forbidigo's output rules are invariant 5's, which binds the pipeline's
      # stages: ir, compilers, pass, emitters and engine, beside the plants that
      # hold the rules, whose tooling package stands for one outside it. emitters
      # is held before it has a package, so no plant can show it reaches there.
      # Those rules carry no msg, which forbidigo reports as "forbidden by
      # pattern", so the recover rule, which carries one, holds everywhere.
      - path-except: ^((ir|compilers|pass|emitters|engine)/|internal/lintrules/testdata/planted/[^/]+$)
        linters:
          - forbidigo
        text: forbidden by pattern
      # barrier is the one package that recovers a panic.
      - path: ^barrier/
        linters:
          - forbidigo
        text: use of `recover`
      # A test may print, and a forced type assertion in one fails the test by
      # panicking, which is what an assertion is for there. The comma-ok rule
      # keeps a panic from escaping a package to its callers. A test may also
      # swap a process global, such as os.Args to drive a main, and put it back.
      - path: _test\.go
        linters:
          - forbidigo
          - forcetypeassert
          - reassign
      # liveForCalls is a context.Context: it embeds the one it wraps to answer Err
      # on a schedule, which is how a context decorator is written, not a context
      # held for later.
      - path: compilers/openapi/budgets_internal_test\.go
        linters:
          - containedctx
        source: ^\s*context\.Context$
      # external is the file system the parser's resolver reads documents
      # through, and fs.FS's Open takes no context, so the context the
      # resolution runs under is held for the reads Open makes through the
      # caller's reader, as the resolver holds its own.
      - path: compilers/openapi/internal/load/external\.go
        linters:
          - containedctx
        source: ^\s*ctx\s+context\.Context$
      # destWriter is the io.Writer json.MarshalWrite encodes into, and Write
      # takes no context, so the context the encoding runs under is held for
      # the writes that one call makes.
      - path: engine/output/output\.go
        linters:
          - containedctx
        source: ^\s*ctx\s+context\.Context$
      # keyed runs as pointer reads step through models, and the Type.Fields
      # range this proposes costs it four allocations a call where indexing
      # costs none. TestKeyed_CostsNoAllocation holds it there.
      - path: compilers/openapi/internal/navigation/navigation\.go
        linters:
          - modernize
        text: stditerators

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/dexpace/morphic)
