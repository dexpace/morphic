name: gate
on:
  push:
    branches: [main]
  pull_request:
# Every check below runs a Makefile target, so `make gate` on a developer machine
# is these same commands in the same order — .NOTPARALLEL in the Makefile keeps
# that true under `make -j`. Lint is the one check that does not run a target:
# the action installs the pinned release and runs it, and the step above reads
# that pin back from the Makefile so the version still has a single definition.
# Add a check to the Makefile and give it a step here; do not spell a command out
# in this file. The cache steps are not checks: they carry the Go build cache
# from main to every run, and scripts/go-cache.sh explains why that takes more
# than a restore.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read from go.mod, so the toolchain has one definition and this file
          # holds no copy of it to drift. `make gate` pins the same version from
          # the same line, which is what makes the two the same run.
          go-version-file: go.mod
          # The steps below cache instead: setup-go saves once per dependency
          # set and never again, so its build cache only ever holds the first
          # run to see a go.sum.
          cache: false
      - name: go cache paths
        id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"
      # Main saves a cache per commit and every run restores the newest, so a
      # pull request starts from what main last built. A change to go.mod or
      # go.sum starts over.
      - name: restore go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: age restored build cache
        if: steps.go-cache.outputs.cache-matched-key != ''
        run: ./scripts/go-cache.sh age
      - name: gofmt
        run: make fmt
      - name: vet
        run: make vet
      - name: lint version
        id: lint-version
        run: echo "version=$(make -s print-lint-version)" >>"$GITHUB_OUTPUT"
      - name: lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          # Pinned so a golangci-lint release cannot redden main without a commit,
          # and so the nolint steps below describe the run that produced the
          # findings above: they ask golangci-lint which linters it is running,
          # which only answers for this step if it is the same build. The pin
          # itself lives in the Makefile and is read back by the step above.
          version: ${{ steps.lint-version.outputs.version }}
      # The action leaves the golangci-lint it installed on PATH for later steps
      # (core.addPath in its entrypoint), so these reach that same binary.
      - name: nolint grammar
        run: make nolint-grammar
      - name: nolint directives
        run: make nolint
      - name: build
        run: make build
      - name: coverage counting
        run: make coverage-count
      - name: test (race detector, exactly 100% coverage)
        run: make coverage
      - name: fuzz
        id: fuzz
        run: make fuzz
      - name: benchmarks
        run: make bench-smoke
      # A crash the fuzz step finds is written to <pkg>/testdata/fuzz/<Target>/
      # in the runner's workspace and would otherwise die with it, leaving a red
      # gate and no reproducer to commit.
      - name: upload fuzz findings
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
      # Only a green run on main saves, so pull requests share one cache rather
      # than each storing its own, and the save holds what this run used.
      - name: prune build cache
        if: github.ref == 'refs/heads/main'
        run: ./scripts/go-cache.sh prune
      - name: save go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
