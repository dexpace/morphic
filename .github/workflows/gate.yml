name: gate
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

# A push to a pull request supersedes the run its previous push started. Runs on
# main are never cancelled: each saves the caches the pull requests after it use.
# The race run shares no group with them, since a scheduled run carries main's
# sha, and queues behind one already running.
concurrency:
  group: gate-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || 'race' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The gate runs as two jobs side by side. Every check is a Makefile target, and
# `make gate` runs them all. The race detector is the third job, which runs only
# on a schedule or by hand and which `make gate` leaves out.
#
# A run on main starts from empty Go build and module caches and saves what it
# built. A pull request's run restores what the latest run of the same job on
# main saved, so it rebuilds only what the change touches. Main never restores,
# so each save holds one run's builds and the cache cannot grow from one commit
# to the next.
jobs:
  checks:
    name: lint, fuzz, bench
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - &toolchain
        name: toolchain pin
        id: toolchain
        run: |
          version="$(env -u GOTOOLCHAIN make -s print-go-version)"
          echo "GOTOOLCHAIN=go$version" >>"$GITHUB_ENV"
          {
            echo "version=$version"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >>"$GITHUB_OUTPUT"
      - &restore
        name: restore main's caches
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.toolchain.outputs.gocache }}
            ${{ steps.toolchain.outputs.gomodcache }}
          key: go-${{ github.job }}-${{ runner.os }}-go${{ steps.toolchain.outputs.version }}-${{ github.sha }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-go${{ steps.toolchain.outputs.version }}-
      - name: gofmt
        run: make fmt
      - name: vet
        run: make vet
      - name: lint version
        id: lint-version
        run: echo "version=$(make -s print-lint-version)" >>"$GITHUB_OUTPUT"
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint-version.outputs.version }}
      - name: lint rules draw their planted findings
        run: make lint-planted
      - name: fuzz
        id: fuzz
        run: make fuzz
      - name: benchmarks
        run: make bench-smoke
      - name: upload fuzz findings
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
      - &save
        name: save caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.toolchain.outputs.gocache }}
            ${{ steps.toolchain.outputs.gomodcache }}
          key: go-${{ github.job }}-${{ runner.os }}-go${{ steps.toolchain.outputs.version }}-${{ github.sha }}

  suite:
    name: build, test (exactly 100% coverage)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - *setup-go
      - *toolchain
      - *restore
      # Tests that load packages with go/packages run go list -export, which
      # compiles what make build does. Built first, that compile no longer runs
      # beside the tests that time a child process, which load can push past
      # their bound (#1010).
      - name: build
        run: make build
      - name: test
        run: make coverage
      - *save

  # The race detector, each night main has moved since the last scheduled run
  # that finished. It restores and saves no cache. A failure opens an issue, or
  # comments on the one still open, so it is not left on a run nobody reads.
  #
  # This job alone may write to issues, and it runs only main's code or a
  # writer's dispatch, never a pull request's. The checkout leaves no credential
  # in .git/config, and the race step's environment holds no token, but checkout
  # and setup-go are handed one as an input's default, and the two steps that
  # call the API as GH_TOKEN.
  race:
    name: race detector
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      ISSUE_TITLE: "ci: the nightly race run fails on main"
    steps:
      # A dispatch always runs. A scheduled run is skipped where the last one
      # that finished, red or green, ran at this sha: a red one has its issue.
      - name: main moved
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?event=schedule&branch=main&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""')"
          echo "last=$last" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice::main has not moved since the last race run, at $last"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.moved.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.moved.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: toolchain pin
        if: steps.moved.outputs.run == 'true'
        run: echo "GOTOOLCHAIN=go$(env -u GOTOOLCHAIN make -s print-go-version)" >>"$GITHUB_ENV"
      # Built first for the suite job's reason (#1010), which this job's empty
      # cache makes stronger: every package compiles here.
      - name: build
        if: steps.moved.outputs.run == 'true'
        run: make build
      # A step's timeout fails the step, which the report below sees; the job's
      # would cancel it, which it does not.
      - name: race
        if: steps.moved.outputs.run == 'true'
        timeout-minutes: 35
        shell: bash
        run: make race 2>&1 | tee race.log
      - name: report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ steps.moved.outputs.last }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The race run failed on $GITHUB_REF_NAME at $GITHUB_SHA: $RUN_URL"
            if [ -n "$LAST" ]; then
              echo
              echo "The last scheduled run finished at $LAST: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$LAST...$GITHUB_SHA"
            fi
            failures="$(grep -E '^(race:|--- FAIL|FAIL|WARNING: DATA RACE|panic:)' race.log 2>/dev/null | head -n 100)"
            if [ -n "$failures" ]; then
              echo
              echo "Its failures, at most 100 lines; the run's log holds the rest:"
              echo
              echo '```'
              echo "$failures"
              echo '```'
            elif [ -s race.log ]; then
              echo
              echo "Its output names no failure, as when the step times out: read the run's log."
            else
              echo
              echo "It failed before the suite ran: read the run's log."
            fi
          } >"$RUNNER_TEMP/body.md"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/body.md" --label type:bug --label priority:P1
          fi
