name: gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # One version drives both golangci-lint steps below. The nolint check asks
      # golangci-lint which linters are enabled, so its answer only describes the
      # lint step above it if the two are the same build. Naming the version also
      # means a golangci-lint release cannot redden main without a commit.
      GOLANGCI_LINT_VERSION: v2.12.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      # The action runs golangci-lint from a path of its own and does not put it
      # on PATH, so the check installs the same version for itself.
      - name: nolint directives
        run: |
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" |
            sh -s -- -b "${RUNNER_TEMP}/bin" "${GOLANGCI_LINT_VERSION}"
          PATH="${RUNNER_TEMP}/bin:${PATH}" ./scripts/check-nolint-linters.sh
      - name: build
        run: go build ./...
      - name: coverage counting
        run: ./scripts/verify-coverage-count.sh
      - name: coverage
        run: ./scripts/check-coverage.sh
