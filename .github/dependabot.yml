version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-type: direct
    labels: [dependencies]
    commit-message:
      prefix: build
    groups:
      go:
        patterns: ['*']
        exclude-patterns: [github.com/speakeasy-api/openapi]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
